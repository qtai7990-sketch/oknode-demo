<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой маршрут — макет приложения мигранта</title>
<!-- Макет «Мой маршрут» (приложение клиента на телефоне). Оформление — общий файл ../common/tokens.css, как у агентов и окна оператора.
     Данные вымышленные; сроки и правила — с пометкой [проверить], источники — docs/ репозитория hr-portal и справки notes/. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" onload="window.__qrReady&&window.__qrReady()"></script>
<style>
/* Переменные оформления трёх макетов: agent-neon (Душанбе), agent-zia (Жуковский), office-zia (окно оператора).
   Один источник: сборка каждого макета (build.mjs) вставляет этот файл на место метки __TOKENS__ в стилях.
   Светлая тема — другие значения тех же переменных (блоки :root[data-theme="light"]), а не отдельные правила.
   Новый цвет, эффект или размер — сюда, в оба набора; в правилах — только var(--…). Правишь файл — пересобери все три макета:
   node tools/look/build-all.cjs. Сверка вида с эталоном — tools/look/snap.cjs и diff.cjs; счёт цветов числом — tools/look/inventory.cjs.

   Что где лежит (сверху вниз):
   1. Цвета и эффекты тёмной темы, затем светлой — основа: фон, линии, текст, акценты, свечение, тени, стекло.
   2. Детали оформления, у которых в светлой теме другое значение. Сначала общие по смыслу (--tone-*-ink, --card-bg, --control-bg…),
      потом по файлам: общие стили, агент в Жуковском, окно оператора. Имя детали — от селектора и свойства.
   3. То, что не зависит от темы: маски, страница чужого сайта в окне партнёра, фирменные цвета партнёров, бумага миграционной карты, окно камеры.
   4. Размеры: радиусы, высота кнопки и поля, шапка, меню, кружок шага. */
:root{
  /* Тёмная тема (по умолчанию). Все цвета — здесь; светлая тема переопределяет их ниже. */
  /* фон и поверхности */
  --bg:#060b17; --bg-rgb:6 11 23;
  --surface:#0a1427; --surface-2:#07101f;
  --panel:#0d1830cc; --panel-solid:#0e1a33;
  --sheet:#0b1528; --sheet-a:#0b1528ee; --hover:#12264a;
  --cnt-on-fg:#fff; --cnt-on-bg:rgb(4 18 48 / .42);
  --header:#07101fcc; --side-bg:#07101f99;
  --overlay:#030813; --scrim:#02060fcc; --desk:#02050c; --bezel:#05080f;
  /* линии */
  --line:#1d3358; --line-rgb:29 51 88; --line2:#27477a;
  --grid-line:#ffffff06; --fill-soft:#ffffff08;
  /* текст */
  --text:#e8f1ff; --text-2:#c4d6f2; --text-hi:#fff; --muted:#8aa0c4; --dim:#7388ab;
  --nav-text:#c3d3ee; --text-hl:#cfe4ff;
  /* акценты и статусы: успех — green, предупреждение — amber, ошибка — red */
  --cyan:#2fd3ff; --cyan-rgb:47 211 255; --cyan-hi:#bfefff; --cyan-soft:#9fe9ff; --cyan-mid:#7fe7ff;
  --blue:#1f7bff; --blue-rgb:31 123 255;
  --green:#19f0a0; --green-rgb:25 240 160; --green-2:#2fe8c8; --green-hi:#bff5df;
  --amber:#ffb547; --amber-rgb:255 181 71; --amber-hi:#ffd9a0; --amber-hi2:#ffe7c2; --amber-mid:#e9c48a;
  --violet:#b48cff; --violet-rgb:180 140 255;
  --red:#ff8a9a; --red-rgb:255 93 115;
  --on-accent:#04101f; --on-green:#03140e;
  --gold-a:#ffd27a; --gold-b:#b88a2e;
  /* синяя кнопка и выбранный пункт меню */
  --blue-a:#2b80ff; --blue-b:#1d5fe0; --blue-c:#153e9f; --on-blue:#fff;
  --blue-ring:#6fb0ff77; --blue-hl:#9cc9ff66; --blue-inner:#0a1f6b55; --blue-edge:#0a1f6b; --blue-drop-rgb:31 91 255;
  /* заголовок, знак, картинка в боковой панели */
  --title-a:#fff; --title-b:#bfe6ff;
  --mark-a:#1b52e8; --mark-b:#2f9bff; --mark-c:#b8f3ff; --mark-t:#7fe7ff;
  --route-tint:#2458c8; --route-filter:grayscale(1) brightness(1.02) contrast(1.1); --route-opacity:.8;
  --route-mask:linear-gradient(180deg,transparent 4%,#000 48%); --route-shade:linear-gradient(180deg,transparent 62%,rgb(var(--bg-rgb) / 0.73) 88%,rgb(var(--bg-rgb) / 0.93) 100%);
  /* окно камеры и страница паспорта */
  --vp-a:#12295a; --vp-b:#040a17; --pp-a:#eef2f8; --pp-b:#d6dfec; --pp-line:#a7b6cd; --pp-hatch:#cad5e4; --pp-hatch2:#dde5f0; --pp-ink:#4b6388;
  /* свечение (--gk) и тени (--sk, --shadow-rgb): в светлой теме свечение гаснет, тени мягче */
  --gk:1; --sk:1; --shadow-rgb:0 0 0;
  --glow:0 0 0 1px rgb(var(--cyan-rgb) / .33), 0 0 24px rgb(var(--blue-rgb) / .33), inset 0 0 18px rgb(var(--blue-rgb) / .13);
  --panel-shadow:0 0 transparent; --card-shadow:0 0 transparent; --lift:0 0 transparent;
  --tile-glow:drop-shadow(0 0 5px currentColor);
  --sig-ink:#e9fbff; --sig-glow:rgb(47 211 255 / .75); --sig-blur:14;
  /* выбранный пункт меню: светящаяся кромка слева, блик и ореол */
  --nav-edge:linear-gradient(180deg,#c8f8ff,#2fd3ff 45%,#1f8fff); --nav-edge-glow:0 0 8px 2px rgb(47 211 255 / .95),0 0 26px 6px rgb(47 211 255 / .5);
  --nav-sheen:radial-gradient(85% 130% at 0% 50%,rgb(120 225 255 / .34),transparent 62%),linear-gradient(180deg,rgb(255 255 255 / .14),transparent 48%);
  --nav-halo:0 0 30px rgb(47 211 255 / .36),0 0 0 1px rgb(127 220 255 / .45);
  /* аватар, уголки сканера, значки */
  /* нижняя панель: стекло с лёгким градиентом */
  --foot-glass:linear-gradient(90deg,rgb(13 24 48 / .5),rgb(14 26 51 / .84) 62%,rgb(14 26 51 / .94)); --foot-line:var(--line); --foot-shadow:0 -8px 30px rgb(0 0 0 / .28);
  /* тон фото агента, подложки карточек, контур плиток QR */
  --ava-tone:rgb(47 140 255 / .16); --ava-filter:saturate(1.02) contrast(1.02);
  --wm-color:var(--cyan); --wm-op:.13; --wm-blur:2.2px; --wmi-op:.2;
  --tk-outline:drop-shadow(0 0 .6px rgb(47 211 255 / .75)) drop-shadow(0 0 20px rgb(31 123 255 / .3));
  /* логотип: плитка с градиентом и белым самолётом */
  /* QR: белая плитка, тёмные модули, синие «глаза» — одинаково в обеих темах */
  --qr-ink:#0b1730; --qr-eye:#1d3c84;
  /* страница паспорта-образца: бумага с защитной сеткой, как на настоящем документе */
  --pp-paper:radial-gradient(60% 80% at 85% 45%,rgb(205 160 225 / .35),transparent 70%),repeating-radial-gradient(circle at 20% 130%,rgb(140 100 185 / .09) 0 1px,transparent 1px 6px),repeating-radial-gradient(circle at 105% -30%,rgb(190 110 165 / .08) 0 1px,transparent 1px 7px),repeating-linear-gradient(118deg,rgb(150 120 195 / .05) 0 1px,transparent 1px 5px),linear-gradient(135deg,#efe5f4 0%,#f5ebf1 45%,#ebe8f6 78%,#eef0f8 100%);
  --pp-text:#1d1a28; --pp-label:#5f5672; --pp-head:#3b2b5a; --pp-mrz:#16141f; --pp-spec:rgb(180 40 90 / .13);
  --pp-holo-1:#e7a3d6; --pp-holo-2:#f2d27e; --pp-holo-3:#9fdcc0; --pp-holo-4:#8ec9ee; --pp-holo-5:#b69be8;
  --pp-flag-r:#cc0000; --pp-flag-w:#fff; --pp-flag-g:#006600; --pp-flag-c:#f8c300;
  /* маршрут в меню: стеклянная карточка */
  --rt-bg:rgb(10 20 40 / .55); --rt-line:rgb(var(--cyan-rgb) / .18); --rt-shadow:0 8px 20px rgb(0 0 0 / .35);
  --ava-gap:#0a1427; --ava-lift:0 0 transparent; --cr-lift:0 0 0 transparent; --icon:var(--cyan);
  /* бумажный талон и плитки QR одинаковы в обеих темах: камера телефона читает QR одинаково */
  --lg-plane-a:#fff; --lg-plane-b:#b9d8ff; --lg-glow:drop-shadow(0 0 5px rgb(47 211 255 / .55)) drop-shadow(0 6px 10px rgb(10 30 80 / .5));
  --paper:#f3f5f8; --ink:#0b0f17; --ink-2:#1f2937; --ink-3:#4b5563; --ink-sep:#9aa3af; --card-white:#fff;
  --r:16px;
}
/* Светлая тема: для яркого света в зоне вылета. Стиль — светлое «стекло» с лазурным акцентом (образец владельца, 17.11.2026).
   Формы — те же, что в тёмной теме. Текст к фону — от 4,5 : 1: цвет текста акцента (--cyan, --green, --amber…) темнее,
   чем яркая основа того же акцента для заливок, рамок и «пилюль» (--cyan-rgb, --green-rgb, --amber-rgb…). */
:root[data-theme="light"]{
  --lg-plane-a:#4b8fff; --lg-plane-b:#1450d4; --lg-glow:drop-shadow(0 4px 8px rgb(30 90 200 / .28));
  /* фон: сверху почти белый, книзу голубой; нижняя часть однотонная (--bg) — под нижней панелью контент растворяется без шва */
  --bg:#dfe7f8; --bg-rgb:223 231 248; --bg-top:#eef2fc; --bg-mid:#e6ecfa;
  --surface:#fff; --surface-2:#f3f7fe;
  --panel:#ffffffe6; --panel-solid:#fff;
  --sheet:#fff; --sheet-a:#fffffff2; --hover:#e8f0ff;
  --cnt-on-fg:var(--cyan-hi); --cnt-on-bg:#fff;
  --header:#ffffffd9; --side-bg:transparent;
  --overlay:#eaf1fc; --scrim:#12284f52; --desk:#0a1322; --bezel:#0d121b;
  --line:#dbe5f4; --line-rgb:176 196 226; --line2:#c3d2ea;
  --grid-line:transparent; --fill-soft:#e8eef8;
  --text:#0d1b33; --text-2:#2a3b57; --text-hi:#0d1b33; --muted:#4a5f82; --dim:#4b5f82;
  --nav-text:#22324d; --text-hl:#2a3b57;
  /* акценты: текст / яркая основа заливок */
  --cyan:#155ee0; --cyan-rgb:47 124 255; --cyan-hi:#124fc0; --cyan-soft:#124fc0; --cyan-mid:#2f7cff;
  --blue:#1f6ff2; --blue-rgb:47 124 255;
  --green:#036a4d; --green-rgb:16 185 129; --green-2:#0d9488; --green-hi:#065f46;
  --amber:#a8420a; --amber-rgb:255 138 51; --amber-hi:#8f3a08; --amber-hi2:#6f2c05; --amber-mid:#9c3f09;
  --violet:#5b47d6; --violet-rgb:124 108 255;
  --red:#be2443; --red-rgb:255 86 110;
  --on-accent:#fff; --on-green:#fff;
  --gold-a:#ffc267; --gold-b:#c98a1e;
  /* синяя кнопка и выбранный пункт меню: лазурный градиент образца */
  --blue-a:#2d7cf8; --blue-b:#1b66ea; --blue-c:#1153cf; --on-blue:#fff;
  --blue-ring:#8dbbffb3; --blue-hl:#ffffff73; --blue-inner:#0a3aa82e; --blue-edge:#1153cf59; --blue-drop-rgb:27 102 234;
  --title-a:#0d1b33; --title-b:#173f8a;
  --mark-a:#1557e8; --mark-b:#2f86ff; --mark-c:#5cc8ff; --mark-t:#2f9bff;
  --route-tint:#a9c1ea; --route-filter:grayscale(1) brightness(1.12) contrast(1.06); --route-opacity:.82;
  --route-mask:linear-gradient(180deg,transparent 4%,#000 48%); --route-shade:none;
  --vp-a:#f7faff; --vp-b:#d3dff1; --pp-a:#fff; --pp-b:#eef3fb; --pp-line:#b9c9e2; --pp-hatch:#dfe7f4; --pp-hatch2:#eff4fb; --pp-ink:#3f6fd8;
  /* свечения нет, тени мягкие и голубоватые */
  --gk:0; --sk:.22; --shadow-rgb:20 50 110;
  --edge:#4590ff;
  --glow:0 0 0 1px var(--edge), 0 0 0 5px rgb(var(--cyan-rgb) / .12), 0 14px 30px rgb(var(--cyan-rgb) / .18);
  --panel-shadow:0 1px 2px rgb(30 70 150 / .05), 0 14px 34px rgb(40 90 190 / .09);
  --card-shadow:0 1px 2px rgb(30 70 150 / .05), 0 8px 22px rgb(40 90 190 / .08);
  --lift:0 16px 40px rgb(20 50 110 / .16);
  --tile-glow:none;
  --sig-ink:#0e2152; --sig-glow:rgb(47 124 255 / .45); --sig-blur:8;
  /* главное действие: бирюзовый градиент с бликом, светлая надпись (решение владельца). Оттенок чуть глубже образца:
     белый на ярко-бирюзовом даёт 1,9–2,4 : 1, на этом — около 3 : 1; тень под буквами помогает читать */
  --cta-a:#0b97ad; --cta-b:#13ab9c; --cta-text:#fff; --cta-rgb:22 176 196;
  /* мягкий блик «стекла» в шапке и наверху страницы */
  --sheen:linear-gradient(108deg,transparent 0%,rgb(255 255 255 / .85) 6%,transparent 15%,transparent 22%,rgb(255 255 255 / .35) 27%,transparent 32%,transparent 40%,rgb(255 255 255 / .7) 49%,transparent 58%,transparent 72%,rgb(255 255 255 / .62) 82%,transparent 91%);
  /* выбранный пункт меню: только блик сверху */
  /* те же блики на всю страницу: шире и реже, растянуты сверху вниз */
  --sheen-page:linear-gradient(115deg,transparent 0%,rgb(255 255 255 / .55) 9%,transparent 20%,transparent 30%,rgb(255 255 255 / .26) 37%,transparent 44%,transparent 54%,rgb(255 255 255 / .48) 64%,transparent 75%,transparent 83%,rgb(255 255 255 / .34) 91%,transparent 99%);
  --nav-edge:transparent; --nav-edge-glow:none; --nav-sheen:linear-gradient(180deg,rgb(255 255 255 / .26),transparent 52%); --nav-halo:0 0 0 transparent;
  /* аватар, уголки сканера, значки одного цвета */
  --foot-glass:linear-gradient(90deg,rgb(255 255 255 / .42),rgb(255 255 255 / .8) 62%,rgb(255 255 255 / .92)); --foot-line:#fff; --foot-shadow:0 0 0 1px rgb(var(--line-rgb) / .42),0 -6px 26px rgb(40 90 190 / .08),0 14px 30px rgb(40 90 190 / .12);
  --ava-tone:rgb(80 140 255 / .12); --ava-filter:saturate(1.02);
  --rt-bg:rgb(255 255 255 / .62); --rt-line:#fff; --rt-shadow:0 8px 20px rgb(40 90 190 / .12);
  --wm-color:var(--icon); --wm-op:.11; --wm-blur:1.8px; --wmi-op:.17;
  --tk-outline:drop-shadow(0 0 .6px rgb(70 110 190 / .65)) drop-shadow(0 10px 20px rgb(40 90 190 / .16));
  --ava-gap:#fff; --ava-lift:0 4px 12px rgb(40 90 190 / .28); --cr-lift:0 3px 6px rgb(47 124 255 / .35); --icon:#2a6ef0;
  --pill-a:#e1ecff; --pill-b:#f4f8ff; --pill-line:#c6dafc; --step-bg:#d3e0fa;
  --soft-c:#dfe9ff; --soft-g:#d6f5e5; --soft-a:#fcdcc8; --soft-r:#ffe1e6; --soft-v:#e9e5ff;
  --soft-c-ink:#1b56cc; --soft-g-ink:#0a6644; --soft-a-ink:#5b3322; --soft-r-ink:#a11d38; --soft-v-ink:#4a37c4; --card-line:#e3ebf7; --cb-line:#c2d1e8;
  --r:18px;
}

/* ===== Детали оформления, у которых в светлой теме другое значение: общие по смыслу — у многих деталей сразу. --tone-*-ink: надпись на метке-«пилюле» и цветная надпись статуса (a — внимание, g — готово, c — справка, v — заметка, r — отказ) =====
   Имя — от селектора и свойства: --svc-sel-cb-bg — фон у «.svc.sel .cb». Раньше это были отдельные правила светлой темы. */
:root{
  --mark-on-bg:var(--cyan);
  --card-bg:var(--surface);
  --control-bg:none;
  --track-bg:var(--line);
  --tone-v-ink:var(--violet);
  --tone-g-ink:var(--green);
  --tone-c-ink:var(--cyan);
  --tone-a-ink:var(--amber);
  --tone-r-ink:var(--red);
}
:root[data-theme="light"]{
  --mark-on-bg:linear-gradient(180deg,var(--blue-a),var(--blue-c));
  --card-bg:linear-gradient(180deg,#fff,#f8fbff);
  --control-bg:#fff;
  --track-bg:var(--fill-soft);
  --tone-v-ink:var(--soft-v-ink);
  --tone-g-ink:var(--soft-g-ink);
  --tone-c-ink:var(--soft-c-ink);
  --tone-a-ink:var(--soft-a-ink);
  --tone-r-ink:var(--soft-r-ink);
}

/* ===== Детали оформления, у которых в светлой теме другое значение: общие стили (исходник agent-neon) =====
   Имя — от селектора и свойства: --svc-sel-cb-bg — фон у «.svc.sel .cb». Раньше это были отдельные правила светлой темы. */
:root{
  --th-btn-i-moon-display:none;
  --top-bg:var(--header);
  --top-blur:blur(8px);
  --top-shadow:none;
  --title-line-img:none;
  --tab-brand-mark-line-img:none;
  --net-line:rgb(var(--green-rgb) / 0.27);
  --net-bg:rgb(var(--green-rgb) / 0.06);
  --dot-bg:var(--green);
  --side-line-img:none;
  --nav-cnt-bg:rgb(var(--cyan-rgb) / 0.13);
  --nav-cnt-ink:var(--cyan);
  --steps-line-img:none;
  --step-i-bg:none;
  --step-done-i-bg:none;
  --step-on-ink:var(--text);
  --step-on-i-shadow:0 0 18px rgb(var(--cyan-rgb) / calc(0.67 * var(--gk)));
  --step-on-after-height:2px;
  --step-on-after-r:2px;
  --step-on-after-bg:var(--cyan);
  --step-on-after-shadow:0 0 10px rgb(var(--cyan-rgb) / calc(0.6 * var(--gk)));
  --bar-bg:var(--line);
  --bar-act-bg:linear-gradient(90deg,rgb(var(--cyan-rgb) / 0.8),rgb(var(--blue-rgb) / 0.53) 35%,var(--line) 80%);
  --bar-done-bg:linear-gradient(90deg,rgb(var(--green-rgb) / 0.6),rgb(var(--cyan-rgb) / 0.67));
  --sec-after-bg:linear-gradient(90deg,var(--line),transparent);
  --sec-all-line:rgb(var(--cyan-rgb) / 0.27);
  --sec-all-shadow:none;
  --panel-blur:blur(6px);
  --svc-r:var(--r-xl);
  --svc-sel-bg:linear-gradient(135deg,rgb(var(--blue-rgb) / 0.13),var(--surface) 70%);
  --svc-lock-sel-bg:linear-gradient(135deg,rgb(var(--green-rgb) / 0.07),var(--surface) 70%);
  --svc-lock-sel-shadow:0 0 0 1px rgb(var(--green-rgb) / 0.2),0 0 22px rgb(var(--green-rgb) / calc(0.13 * var(--gk)));
  --svc-sel-cb-shadow:0 0 12px rgb(var(--cyan-rgb) / var(--gk));
  --svc-lock-cb-bg:var(--green);
  --svc-lock-cb-shadow:0 0 12px rgb(var(--green-rgb) / calc(0.53 * var(--gk)));
  --pr-ink:var(--green);
  --var-sel-ink:var(--cyan);
  --track-i-bg:linear-gradient(90deg,var(--green),var(--cyan));
  --track-i-w-bg:linear-gradient(90deg,var(--amber),var(--gold-a));
  --fsum-bar2-i-on-bg:var(--cyan);
  --sheet-bg:var(--sheet);
  --backdrop-blur:none;
  --fr-st-padding:3px 8px;
  --fh-st-padding:4px 9px;
  --fr-st-font-weight:700;
  --st-g-bg:rgb(var(--green-rgb) / 0.08);
  --st-c-bg:rgb(var(--cyan-rgb) / 0.08);
  --st-a-bg:rgb(var(--amber-rgb) / 0.08);
  --otag-o-app-bg:rgb(var(--cyan-rgb) / 0.08);
  --otag-o-ticket-bg:rgb(var(--green-rgb) / 0.07);
  --otag-o-refused-bg:rgb(var(--amber-rgb) / 0.07);
  --otag-o-rkl-bg:rgb(var(--red-rgb) / 0.07);
  --tg-padding:3px 8px;
  --tg-req-bg:rgb(var(--amber-rgb) / 0.09);
  --need-bg:none;
  --ec-ok-bg:rgb(var(--green-rgb) / 0.06);
  --ec-w-bg:rgb(var(--amber-rgb) / 0.07);
  --ec-n-bg:rgb(var(--amber-rgb) / 0.04);
  --chip2-live-bg:rgb(var(--violet-rgb) / 0.07);
  --et-line:rgb(var(--cyan-rgb) / 0.27);
  --et-bg:rgb(var(--cyan-rgb) / 0.06);

}

  --warn:#f59e0b; --mut:#94a3b8; --good:#22c55e; --acc:#22d3ee;
}

/* ===== Размеры: одинаковы в обеих темах. Только то, что уже играет одну роль во всех трёх макетах =====
   Радиус панели --r задан выше вместе с цветами: он свой у каждой темы (16 и 18). Кегли в переменные не вынесены: единой шкалы нет. */
:root{
  /* радиусы: шкала */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px; --r-round:50%;

  --btn-h:56px; --btn-h-sm:44px; --field-h:52px; --tap:48px;
  /* шапка и меню: широкий экран и планшет */
  --top-h:76px; --top-h-tab:52px; --side-w:228px; --side-w-tab:72px;
  /* кружок шага */
  --step-d:30px; --step-d-tab:24px;
}

.demo .brand b{display:block;font-size:17px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--nav-text)}
.demo .brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:.04em}
.demo h3{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.sit{display:flex;flex-direction:column;gap:4px}
.sit button{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-lg);border:1px solid transparent;color:var(--nav-text);font-size:13.5px;line-height:1.3}
.sit button i{font-style:normal;flex:none;width:22px;height:22px;border-radius:var(--r-round);display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line2);color:var(--muted);margin-top:-1px}
.sit button small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.sit button:hover{background:linear-gradient(90deg,rgb(var(--blue-rgb) / 0.13),transparent)}
.sit button.on{background:linear-gradient(90deg,var(--blue-a) 0%,var(--blue-b) 45%,var(--blue-c) 100%);color:var(--on-blue);border-color:var(--blue-ring);box-shadow:inset 0 1px 0 var(--blue-hl),0 8px 22px rgb(var(--blue-drop-rgb) / calc(.35 * var(--gk) + .12))}
.sit button.on small{color:rgb(255 255 255 / .8)} .sit button.on i{border-color:#fff;color:#fff;background:rgb(255 255 255 / .16)}
.tgl{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);width:100%}
.sw .k{width:38px;height:22px;border-radius:var(--r-pill);background:var(--fill-soft);border:1px solid var(--line2);position:relative;flex:none;transition:.15s}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--r-round);background:var(--muted);transition:.15s}
.sw.on .k{background:rgb(var(--cyan-rgb) / .25);border-color:var(--cyan)} .sw.on .k::after{left:18px;background:var(--cyan);box-shadow:0 0 8px rgb(var(--cyan-rgb) / calc(.8 * var(--gk)))}
.look{font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;flex-direction:column;gap:6px}
.look li{list-style:none;padding-left:14px;position:relative} .look li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.look b{color:var(--text-2);font-weight:600}
.stage{display:grid;place-items:center;overflow:hidden;position:relative}

/* ===== Телефон ===== */
.phone{width:418px;height:872px;border-radius:58px;padding:14px;background:var(--bezel);box-shadow:0 0 0 1.5px rgb(var(--cyan-rgb) / calc(.35 * var(--gk) + .1)),0 0 60px rgb(var(--blue-rgb) / calc(.3 * var(--gk))),0 30px 80px rgb(var(--shadow-rgb) / calc(.5 * var(--sk) + .1));transform-origin:center;flex:none;position:relative}
.scr{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);display:flex;flex-direction:column;isolation:isolate;
  background-image:radial-gradient(500px 360px at 100% -5%,rgb(var(--blue-rgb) / 0.2),transparent 60%),radial-gradient(420px 380px at -10% 105%,rgb(var(--cyan-rgb) / 0.12),transparent 60%),var(--sheen-page,none)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:var(--bezel);z-index:40}
.sbar{height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 34px;font-size:15px;font-weight:600;color:var(--text);position:relative;z-index:30}
.sbar .r{display:flex;gap:6px;align-items:center}
/* мобильный вид: без рамки, во весь экран */
.mob .desk{grid-template-columns:1fr}
.mob .demo{display:none}
.mob .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important}
.mob .scr{width:100%;height:100%;border-radius:0}
.mob .island{display:none}
/* настоящий телефон: своя строка состояния — нарисованную не показываем; отступы под вырез и нижнюю полосу жестов */
.mob .desk{height:100dvh}
.mob .sbar{display:none}
.mob .scr{padding-top:max(8px,env(safe-area-inset-top))}
.mob .sheet.full .shd{padding-top:calc(max(8px,env(safe-area-inset-top)) + 6px)}
.mob .tabs{bottom:calc(10px + env(safe-area-inset-bottom))}
.mob .body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.mob .sheet .sbd{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.mob .call{padding-top:calc(30px + env(safe-area-inset-top))}
.hd .t b{white-space:nowrap}
@media (max-width:400px){.mob .hd{gap:6px;padding-left:12px;padding-right:12px}.mob .hd .mark{width:34px;height:30px}.mob .hd .t b{font-size:13px;letter-spacing:.07em}.mob .demoBtn{padding:0 8px}.mob .ib{width:36px}}
.dsit .sit button{font-size:14px;padding:11px 10px}
.dsit .tgl{margin-top:14px}

/* шапка приложения */
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 10px 14px;position:relative;z-index:20}
.hd .mark{width:40px;height:34px}
.hd .t{flex:1;min-width:0;line-height:1.1}
.hd .t b{display:block;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--nav-text)}
.hd .t small{display:block;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:var(--r-round);display:grid;place-items:center;color:var(--text-2);position:relative}
.ib:hover{color:var(--cyan)}
.ib .bd{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-pill);background:var(--red);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 8px rgb(var(--red-rgb) / calc(.8 * var(--gk)))}
.av{width:36px;height:36px;border-radius:var(--r-round);padding:2px;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 0 12px rgb(var(--cyan-rgb) / calc(0.4 * var(--gk))),var(--ava-lift)}
.av span{display:grid;place-items:center;width:100%;height:100%;border-radius:var(--r-round);background:var(--surface);border:2px solid var(--ava-gap);font-size:13px;font-weight:700;color:var(--text)}
.demoBtn{display:none;height:30px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--cyan)}
.mob .demoBtn{display:block}
.dfl{position:absolute;right:14px;top:calc(max(8px,env(safe-area-inset-top)) + 6px);z-index:30}

.off{flex:none;margin:0 14px 8px;padding:8px 12px;border-radius:var(--r-lg);display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--tone-a-ink);background:var(--soft-a,rgb(var(--amber-rgb) / .1));border:1px solid rgb(var(--amber-rgb) / .35)}

.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 110px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:6px 2px 4px;background:linear-gradient(90deg,var(--title-a),var(--title-b) 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:13.5px;color:var(--muted);margin:0 2px 14px;line-height:1.45}
.sec{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin:20px 4px 10px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;box-shadow:var(--panel-shadow);backdrop-filter:blur(10px)}
:root[data-theme="light"] .card{background:linear-gradient(180deg,rgb(255 255 255 / .97),rgb(249 252 255 / .88));border-color:var(--surface);box-shadow:var(--panel-shadow),0 0 0 1px rgb(var(--line-rgb) / .4)}
.card+.card{margin-top:10px}
.card.glow{box-shadow:var(--glow);border-color:transparent}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ch .ic{color:var(--icon);filter:drop-shadow(0 0 6px rgb(var(--cyan-rgb) / calc(.5 * var(--gk))))}
.ch h2{font-size:16px;font-weight:700;flex:1;min-width:0}
.mut{color:var(--muted)} .sm{font-size:12.5px} .xs{font-size:11.5px}
p.t{font-size:13.5px;line-height:1.5;color:var(--text-2)}
p.t+p.t{margin-top:8px}
.chk{color:var(--muted);font-size:11px;font-style:normal;white-space:nowrap}

/* «пилюли» статусов: в тёмной — полупрозрачные, в светлой — пастель с тёмным текстом того же тона */
.pl{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pl.g{color:var(--tone-g-ink);background:var(--soft-g,rgb(var(--green-rgb) / .12));border:1px solid rgb(var(--green-rgb) / .35)}
.pl.a{color:var(--tone-a-ink);background:var(--soft-a,rgb(var(--amber-rgb) / .12));border:1px solid rgb(var(--amber-rgb) / .38)}
.pl.r{color:var(--tone-r-ink);background:var(--soft-r,rgb(var(--red-rgb) / .12));border:1px solid rgb(var(--red-rgb) / .4)}
.pl.c{color:var(--tone-c-ink);background:var(--soft-c,rgb(var(--cyan-rgb) / .1));border:1px solid rgb(var(--cyan-rgb) / .35)}
.pl.d{color:var(--muted);background:var(--fill-soft);border:1px solid var(--line)}

.btn{height:52px;padding:0 18px;border-radius:var(--r-xl);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;width:100%;transition:filter .15s}
.btn.go{background:var(--btn-go-bg);color:var(--btn-go-ink);box-shadow:var(--btn-go-shadow);letter-spacing:.02em}
.btn.blue{background:linear-gradient(90deg,var(--blue-a),var(--blue-b) 50%,var(--blue-c));color:var(--on-blue);box-shadow:inset 0 1px 0 var(--blue-hl),0 8px 24px rgb(var(--blue-drop-rgb) / calc(.35 * var(--gk) + .15))}
.btn.ghost{border:1px solid var(--line2);color:var(--text);box-shadow:var(--btn-ghost-shadow);background:var(--control-bg)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.sm{height:42px;font-size:14px;border-radius:var(--r-lg)}
.btn:disabled{opacity:.45;filter:saturate(.4);box-shadow:none}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.lnk{color:var(--cyan);font-weight:600;font-size:13px}

.note{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-lg);background:rgb(var(--blue-rgb) / 0.07);border:1px solid rgb(var(--blue-rgb) / 0.2);color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:12px}
.note svg{color:var(--cyan);margin-top:1px}
.note.a{background:var(--soft-a,rgb(var(--amber-rgb) / .08));border-color:rgb(var(--amber-rgb) / .35);color:var(--text-2)} .note.a svg{color:var(--amber)}
.note.r{background:var(--soft-r,rgb(var(--red-rgb) / .08));border-color:rgb(var(--red-rgb) / .4);color:var(--text-2)} .note.r svg{color:var(--red)}

/* ===== Главная: фото аэропорта и путь ===== */
.hero{border-radius:var(--r);overflow:hidden;position:relative;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;border:1px solid var(--line);box-shadow:var(--panel-shadow)}

.hero.alert-a{box-shadow:0 0 0 1px rgb(var(--amber-rgb) / .5),0 0 26px rgb(var(--amber-rgb) / calc(.25 * var(--gk)))}
.hero.alert-r{box-shadow:0 0 0 1px rgb(var(--red-rgb) / .6),0 0 26px rgb(var(--red-rgb) / calc(.3 * var(--gk)))}

.bignum{display:flex;align-items:center;gap:14px;margin:12px 0 4px}
.bignum .n{font-family:ui-monospace,Consolas,monospace;font-size:44px;font-weight:800;letter-spacing:.04em;color:var(--text-hi);text-shadow:0 0 18px rgb(var(--cyan-rgb) / calc(.7 * var(--gk)))}
.bignum .w{font-size:13px;color:var(--muted);line-height:1.35}
.bignum .w b{display:block;color:var(--text);font-size:15px}
.qpos{display:flex;gap:4px;margin-top:10px}
.qpos i{flex:1;height:6px;border-radius:3px;background:var(--fill-soft);border:1px solid var(--line)}
.qpos i.d{background:rgb(var(--cyan-rgb) / .35);border-color:transparent}
.qpos i.me{background:var(--cyan);box-shadow:0 0 10px rgb(var(--cyan-rgb) / calc(.9 * var(--gk)))}

.path{position:relative;padding-left:4px;margin-top:6px}
.pt{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:16px}
.pt:last-child{padding-bottom:0}
.pt::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line2);border-radius:1px}
.pt:last-child::before{display:none}
.pt.done::before{background:linear-gradient(180deg,var(--green),rgb(var(--green-rgb) / .3))}
.pt.now::before{background:repeating-linear-gradient(180deg,var(--cyan) 0 5px,transparent 5px 10px)}
.pt .o{width:34px;height:34px;border-radius:var(--r-round);display:grid;place-items:center;border:1.5px solid var(--line2);color:var(--muted);background:var(--surface)}
.pt.done .o{border-color:var(--green);color:var(--green);background:rgb(var(--green-rgb) / .1)}
.pt.now .o{border-color:var(--cyan);color:var(--on-accent);background:var(--cyan);box-shadow:0 0 0 4px rgb(var(--cyan-rgb) / .15),0 0 16px rgb(var(--cyan-rgb) / calc(.8 * var(--gk)))}
.pt .tx{padding-top:5px;min-width:0}
.pt .tx b{font-size:14.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pt .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.pt.next .tx b{color:var(--text-2);font-weight:600}
.pt .sub{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.sv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-lg);background:var(--fill-soft);border:1px solid var(--line);font-size:13px}
.sv .sn{flex:1;min-width:0}
.sv .sn small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.35}
.sv>svg{color:var(--icon)}

/* ===== списки ===== */
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid rgb(var(--line-rgb) / .6);width:100%}
.li:last-child{border-bottom:0}
.li .lic{width:38px;height:38px;border-radius:var(--r-lg);display:grid;place-items:center;flex:none;color:var(--icon);background:rgb(var(--cyan-rgb) / .08);border:1px solid rgb(var(--cyan-rgb) / .22)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.li .lt small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}
.li>.chev{color:var(--dim)}
button.li:hover .lt b{color:var(--cyan)}

/* сроки */
.dl{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.dd{border-radius:var(--r-lg);text-align:center;padding:8px 4px;border:1px solid var(--line);background:var(--fill-soft)}
.dd b{display:block;font-size:22px;font-weight:800;line-height:1}
.dd small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.dd.g{border-color:rgb(var(--green-rgb) / .45)} .dd.g b{color:var(--green)}
.dd.a{border-color:rgb(var(--amber-rgb) / .5);box-shadow:0 0 14px rgb(var(--amber-rgb) / calc(.2 * var(--gk)))} .dd.a b{color:var(--amber)}
.dd.r{border-color:rgb(var(--red-rgb) / .55);box-shadow:0 0 14px rgb(var(--red-rgb) / calc(.25 * var(--gk)))} .dd.r b{color:var(--red)}
.dd.ok b{color:var(--green);font-size:18px}
.dl h3{font-size:14.5px;font-weight:700;line-height:1.3}
.dl .who{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.dl .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.rem{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed rgb(var(--line-rgb) / .8);font-size:12.5px;color:var(--text-2)}
.rem .sw{width:auto;margin-left:auto}

/* кошелёк патента */
.wal{border-radius:20px;padding:18px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--blue-a),var(--blue-c) 60%,rgb(var(--cyan-rgb) / .9));box-shadow:inset 0 1px 0 var(--blue-hl),0 14px 34px rgb(var(--blue-drop-rgb) / calc(.4 * var(--gk) + .18))}
.wal::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgb(255 255 255 / .22),transparent 70%)}
.wal .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;opacity:.85}
.wal .big{font-size:30px;font-weight:800;margin:6px 0 2px}
.wal .s{font-size:12.5px;opacity:.88}
.wal .bar{height:8px;border-radius:4px;background:rgb(255 255 255 / .22);margin:14px 0 6px;overflow:hidden}
.wal .bar i{display:block;height:100%;border-radius:4px;background:#fff;box-shadow:0 0 10px rgb(255 255 255 / .8)}
.wal .ft{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85}
.wal.late{background:linear-gradient(135deg,rgb(var(--red-rgb) / .95),var(--blue-c))}
.wal.soon .bar i{background:var(--amber-hi,#ffd9a0)}

/* вакансии */
.vc .top{display:flex;gap:10px;align-items:flex-start}
.vc .lg{width:42px;height:42px;border-radius:var(--r-lg);display:grid;place-items:center;font-weight:800;color:var(--on-blue);background:linear-gradient(135deg,var(--blue-a),var(--blue-c));flex:none}
.vc h3{font-size:15px;font-weight:700;line-height:1.25}
.vc .co{font-size:12.5px;color:var(--muted);margin-top:2px}
.vc .pay{font-size:17px;font-weight:800;margin-top:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font-size:11.5px;padding:3px 8px;border-radius:var(--r-pill);border:1px solid var(--line2);color:var(--text-2)}
.fld{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin-top:4px}
.fld dt{color:var(--muted)} .fld dd{font-weight:600;overflow-wrap:anywhere}
.fld dd.no{color:var(--dim);font-weight:500}

/* нижние вкладки: стекло */
.tabs{position:absolute;left:10px;right:10px;bottom:12px;height:70px;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);z-index:25;
  background:var(--foot-glass);border:1px solid var(--foot-line);box-shadow:var(--foot-shadow);backdrop-filter:blur(16px) saturate(1.2)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative;text-align:center}
.tabs button.on{color:var(--cyan)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgb(var(--cyan-rgb) / calc(.9 * var(--gk))))}
.tabs button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--nav-edge,var(--cyan));box-shadow:var(--nav-edge-glow,none)}
:root[data-theme="light"] .tabs button.on::before{background:var(--cyan)}
.tabs .dt{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgb(var(--amber-rgb) / calc(.9 * var(--gk)))}
.tabs .dt.r{background:var(--red)}

/* ===== листы и окна поверх ===== */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;backdrop-filter:blur(3px);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;z-index:51;border-radius:28px 28px 0 0;background:var(--sheet-a);border-top:1px solid var(--line2);box-shadow:0 -10px 40px rgb(var(--shadow-rgb) / .4);display:flex;flex-direction:column;animation:up .25s ease}
.sheet.full{top:0;max-height:none;border-radius:0}
.sheet .gr{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 4px;flex:none}
.sheet .shd{display:flex;align-items:center;gap:8px;padding:6px 14px 8px 8px;flex:none}
.sheet .shd h2{font-size:17px;font-weight:700;flex:1}
.sheet .sbd{overflow-y:auto;padding:4px 16px 26px;scrollbar-width:none}
.sheet.full .shd{padding-top:50px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fadein{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,10px);opacity:0;transition:.25s;z-index:60;padding:12px 16px;border-radius:var(--r-xl);background:var(--panel-solid);border:1px solid rgb(var(--green-rgb) / .47);box-shadow:0 0 24px rgb(var(--green-rgb) / calc(.25 * var(--gk))),var(--lift);font-size:13.5px;display:flex;gap:8px;align-items:center;width:max-content;max-width:340px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--green)}

/* вызов к окну */
.call{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 40%,rgb(var(--cyan-rgb) / .25),var(--overlay) 70%);animation:fade .2s}
.call .ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--cyan);box-shadow:0 0 0 0 rgb(var(--cyan-rgb) / .6);animation:pulse 1.4s infinite;color:var(--cyan)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(var(--cyan-rgb) / .55)}100%{box-shadow:0 0 0 40px rgb(var(--cyan-rgb) / 0)}}
.call .k{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-top:26px}
.call .n{font-family:ui-monospace,Consolas,monospace;font-size:58px;font-weight:800;margin:6px 0;color:var(--text-hi);text-shadow:0 0 22px rgb(var(--cyan-rgb) / calc(.8 * var(--gk)))}
.call .w{font-size:26px;font-weight:700}
.call p{color:var(--muted);font-size:13.5px;margin:10px 0 26px;line-height:1.45}

/* бумажный талон на экране: те же цвета, что у напечатанного, чтобы сканер читал одинаково */
.ticket{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 18px 16px;position:relative;filter:var(--tk-outline);margin:6px auto 0;max-width:300px}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--paper) 5.5px) 0 0/12px 8px repeat-x}
.ticket::before{top:-7px;transform:scaleY(-1)} .ticket::after{bottom:-7px}
.ticket .th{display:flex;gap:10px;align-items:center;justify-content:center;font-weight:800;letter-spacing:.14em;font-size:12.5px}
.ticket .th small{display:block;font-weight:500;letter-spacing:.02em;color:var(--ink-3);font-size:11px;margin-top:2px}
.ticket .code{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:28px;letter-spacing:.05em;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;margin:12px auto;width:max-content}
.ticket canvas{display:block;width:180px;height:180px;margin:0 auto;image-rendering:pixelated}
.ticket ul{list-style:none;margin-top:12px;border-top:1px dashed var(--ink-sep);padding-top:10px;display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.ticket ul li{display:flex;gap:8px;align-items:center}
.ticket .tg{margin-top:10px;font-size:11.5px;color:var(--ink-2);border:1px solid var(--ink-sep);border-radius:8px;padding:7px 9px;text-align:center;line-height:1.35}
.ticket .on2{margin-top:12px;border-top:1px dashed var(--ink-sep);padding-top:10px;text-align:center;font-size:12px;color:var(--ink-3)}
.ticket .on2 b{display:block;font-family:ui-monospace,Consolas,monospace;font-size:30px;color:var(--ink);letter-spacing:.04em}

/* памятка — лист бумаги */
.a4{background:var(--card-white);color:var(--ink);border-radius:6px;padding:18px 16px;font-size:12px;line-height:1.45;box-shadow:var(--lift)}
.a4 .ah{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:10px}
.a4 .ah b{letter-spacing:.12em;font-size:12px} .a4 .ah span{color:var(--ink-3);font-size:11px;text-align:right}
.a4 h4{font-size:12.5px;margin:12px 0 4px}
.a4 ul{padding-left:16px} .a4 li{margin:2px 0}
.a4 table{width:100%;border-collapse:collapse;margin-top:4px} .a4 td{border-top:1px solid var(--ink-sep);padding:5px 4px;vertical-align:top} .a4 td:first-child{white-space:nowrap;font-weight:700;width:90px}
.a4 .af{margin-top:12px;padding-top:8px;border-top:1px solid var(--ink-sep);color:var(--ink-3);font-size:10.5px}
.rcp{background:var(--paper);color:var(--ink);border-radius:4px;padding:16px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;max-width:280px;margin:0 auto;filter:var(--tk-outline)}
.rcp .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0} .rcp .tt{border-top:1px dashed var(--ink-sep);margin-top:6px;padding-top:6px;font-weight:800}
.rcp .c{text-align:center} .rcp small{color:var(--ink-3)}

/* вход */
.ob{flex:1;display:flex;flex-direction:column;padding:10px 22px 28px;overflow-y:auto;scrollbar-width:none}
.ob .logo{display:flex;flex-direction:column;align-items:center;margin:34px 0 26px;text-align:center}
.ob .logo .mark{width:96px;height:82px}
.ob .logo b{font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:14px;color:var(--nav-text)}
.ob .logo small{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.4;max-width:280px}
.langs{display:flex;flex-direction:column;gap:8px}
.langs button{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:var(--r-xl);border:1px solid var(--line2);font-size:16px;font-weight:600;background:var(--control-bg)}
.langs button small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12.5px}
.langs button.on{border-color:var(--cyan);box-shadow:var(--glow)}
.langs button .cb{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.langs button.on .cb{background:var(--cyan);border-color:var(--cyan);color:var(--on-accent)}
.ob .grow{flex:1}
.ob .acts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:6px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.inp{height:56px;border-radius:var(--r-xl);border:1px solid var(--line2);background:var(--control-bg);padding:0 16px;font-size:18px;font-weight:700;letter-spacing:.06em;width:100%;outline:none;font-family:ui-monospace,Consolas,monospace;text-transform:uppercase}
.inp:focus{border-color:var(--cyan);box-shadow:var(--glow)}
.inp.bad{border-color:var(--red)}
.err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:18px}
.dob{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.dob .inp{text-align:center;padding:0 6px}
.dob label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;text-align:center}
/* камера: рамка сканера со светящимися уголками, как окно камеры у агента */
.cam{position:relative;height:360px;border-radius:var(--r);overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--vp-a),var(--vp-b));margin-top:6px}
.cam .tk{position:absolute;left:50%;top:50%;width:170px;transform:translate(-50%,-50%) rotate(-6deg);background:var(--paper);border-radius:8px;padding:12px;box-shadow:0 20px 40px rgb(0 0 0 / .5);filter:blur(.3px)}
.cam .tk canvas{width:100%;height:auto;display:block}
.cam .tk b{display:block;text-align:center;font-family:ui-monospace,Consolas,monospace;color:var(--ink);font-size:15px;margin-bottom:6px}
.cam .fr{position:absolute;left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%)}
.cam .fr i{position:absolute;width:34px;height:34px;border:3px solid var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.cam .fr i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.cam .fr i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.cam .fr i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.cam .fr i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.cam .ln{position:absolute;left:8px;right:8px;height:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:10px}to{top:206px}}
.cam .ok{position:absolute;inset:0;display:grid;place-items:center;background:rgb(var(--bg-rgb) / .55);color:var(--green);font-weight:700;font-size:16px;text-align:center;animation:fade .2s}
.cam .ok svg{margin:0 auto 8px;display:block;filter:drop-shadow(0 0 10px rgb(var(--green-rgb) / .8))}
.tiny{font-size:11.5px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.45}

.mob .stage{display:block}

/* ===== часть 2: сервисы ===== */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 4px 10px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line);box-shadow:var(--card-shadow);min-width:0}
:root[data-theme="light"] .tile{background:var(--surface);border-color:var(--card-line)}
.tile .ti{width:40px;height:40px;border-radius:var(--r-round);display:grid;place-items:center;color:var(--icon);background:rgb(var(--cyan-rgb) / .1);border:1px solid rgb(var(--cyan-rgb) / .25);margin-bottom:4px;filter:drop-shadow(0 0 6px rgb(var(--cyan-rgb) / calc(.35 * var(--gk))))}
.tile.r .ti{color:var(--red);background:rgb(var(--red-rgb) / .1);border-color:rgb(var(--red-rgb) / .4)}
.tile b{font-size:12px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.tile small{font-size:10px;color:var(--muted);line-height:1.2}
.tile:hover{border-color:var(--cyan)}
.tdot{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%}
.tdot.g{background:var(--green);box-shadow:0 0 8px rgb(var(--green-rgb) / calc(.9 * var(--gk)))} .tdot.r{background:var(--red)} .tdot.c{background:var(--cyan);box-shadow:0 0 8px rgb(var(--cyan-rgb) / calc(.9 * var(--gk)))}
.btn.sos{background:linear-gradient(90deg,rgb(var(--red-rgb) / .95),rgb(var(--red-rgb) / .75));color:#fff;text-decoration:none;box-shadow:0 8px 24px rgb(var(--red-rgb) / calc(.35 * var(--gk) + .15))}
.steps{padding-left:20px;font-size:13.5px;line-height:1.5;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
.seg2{display:flex;gap:4px;padding:4px;border-radius:var(--r-lg);background:var(--fill-soft);border:1px solid var(--line)}
.seg2 button{flex:1;height:34px;border-radius:var(--r-md);font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 6px;white-space:nowrap}
.seg2 button.on{background:linear-gradient(90deg,var(--blue-a),var(--blue-b));color:var(--on-blue);box-shadow:0 4px 12px rgb(var(--blue-drop-rgb) / calc(.3 * var(--gk) + .1))}
.seg2.wrap{flex-wrap:wrap} .seg2.wrap button{flex:1 1 30%}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:12px;min-height:200px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg span{padding:10px 12px;border-radius:16px;font-size:13.5px;line-height:1.4}

// карточка срока
function dlCard(x){
  const tn=x.done?'ok':tone(x.left);
  const big=x.done?ico('check',22,3):x.left<0?'+'+(-x.left):x.left;
  const lab=x.done?'готово':x.left<0?'дн. просрочки':x.left===0?'сегодня':'дн. осталось';
  return `<div class="card"><div class="dl"><div class="dd ${tn}"><b class="num">${big}</b><small>${lab}</small></div><div><h3>${x.t}</h3>`+
    `<div class="who">${x.done?esc(x.done):(x.pay?'до ':'до ')+'<b class="num" style="color:var(--text)">'+fd(x.due)+'</b>'}</div>`+
    (S.tab==='dl'?`<div class="who">${esc(x.who)}</div><div class="meta"><span class="xs mut">${esc(x.src)}</span>${CHK}</div>`+
      (x.done?'':`<div class="rem">${ico('bell',16)}<span>${x.pay?'Напомнить за 5 дней и за день':'Напомнить за 7 дней и за день'}</span><button class="sw ${S.remind[x.k]?'on':''}" data-rem="${x.k}" aria-label="Напоминание"><span class="k"></span></button></div>`)+
      (x.pay&&!x.done?`<button class="btn go sm" style="margin-top:10px" data-a="pay" ${S.off||x.left<0?'disabled':''}>${ico('qr',18)}Оплатить по QR</button>`:''):'')+

// ----- QR
function drawQr(text,c,mono){
  const x=c.getContext('2d');let n,dark;
  if(window.qrcode){const q=qrcode(0,'M');q.addData(text);q.make();n=q.getModuleCount();dark=(r,k)=>q.isDark(r,k)}
  else{n=29;let seed=[...text].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296;
    const g=[...Array(n)].map(()=>[...Array(n)].map(()=>rnd()<.5));dark=(r,k)=>g[r][k]}
  const cs=getComputedStyle(document.documentElement),cv=(v,d)=>cs.getPropertyValue(v).trim()||d,bg=cv('--paper','#f3f5f8');
  const ink=mono?cv('--ink','#0b0f17'):cv('--qr-ink','#0b1730'),eyeC=mono?ink:cv('--qr-eye','#1d3c84');
  const m=2,cell=16,s=(n+m*2)*cell,g=cell*.07,rad=cell*.32;c.width=c.height=s;x.fillStyle=bg;x.fillRect(0,0,s,s);
  const fin=(r,k)=>(r<7&&(k<7||k>=n-7))||(r>=n-7&&k<7);x.fillStyle=ink;
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(dark(r,k)&&!fin(r,k)){x.beginPath();x.roundRect((k+m)*cell+g,(r+m)*cell+g,cell-2*g,cell-2*g,rad);x.fill()}
  for(const[r0,k0]of[[0,0],[0,n-7],[n-7,0]]){const X=(k0+m)*cell,Y=(r0+m)*cell;
    x.fillStyle=eyeC;x.beginPath();x.roundRect(X,Y,7*cell,7*cell,1.25*cell);x.fill();
    x.fillStyle=bg;x.beginPath();x.roundRect(X+cell,Y+cell,5*cell,5*cell,.9*cell);x.fill();
    x.fillStyle=eyeC;x.beginPath();x.roundRect(X+2*cell,Y+2*cell,3*cell,3*cell,.8*cell);x.fill()}
}

  drawQr(k==='pay'?'ST00012|Name=FNS demo|Sum='+PAT.rate*S.pay.months*100+'|Purpose=patent demo':C.qr,c,k==='ticket'||k==='cam')})}

const FAQ=[["Документы и сроки","Что делать с миграционной картой?","Храните её вместе с паспортом всё время, пока вы в России, и не теряйте. Для патента в карте должна стоять цель визита «работа». [проверить]","docs/00 §3; office-zia/README («Цель визита»)",1],["Документы и сроки","Я потерял миграционную карту. Что делать?","Скажите оператору — поможем. Дубликат обычно получают в отделении МВД по месту пребывания, и сделать это нужно до выезда из России. [проверить]","vseadvokaty.ru",1],["Документы и сроки","В миграционной карте цель не «работа». Это проблема?","С такой целью патент могут не оформить. [проверить] Покажите карту оператору — разберём, что можно сделать в вашем случае.","office-zia/README («Цель визита»); docs/00 §12",1],["Документы и сроки","Сколько дней дают, чтобы встать на учёт?","Гражданам Таджикистана — 15 дней, Киргизии — 30 дней после въезда. [проверить] Для Узбекистана, по данным из сети, тоже 15 дней, если цель — работа. [проверить]","docs/00 §11; ppt.ru",1],["Документы и сроки","Кто подаёт уведомление о прибытии?","Подаёт принимающая сторона — хозяин жилья, хостел или работодатель. [проверить] Отрывную часть уведомления держите вместе с паспортом. [проверить]","ppt.ru",1],["Документы и сроки","Сколько можно находиться в России без патента?","Без патента и других оснований — не больше 90 дней в течение 180 дней. [проверить] Если превысить, могут запретить въезд на несколько лет.","docs/00 §7; consultant.ru",1],["Документы и сроки","Почему моё имя по-русски написано не так, как я привык?","Написание берём из паспорта по правилам ПП РФ № 1485 от 05.11.2024. Если в ваших документах имя написано по-разному, скажите оператору — сверим и выберем, как правильно.","docs/00 §6, §7",0],["Документы и сроки","Нужен ли нотариальный перевод паспорта?","Для SIM-карты и банковской карты не нужен: оператор связи и банк сами пишут ваше имя по правилам МВД. Для патента и некоторых других документов перевод нужен. [проверить] Сделать его можно у нас: электронно или у стола нотариуса.","владелец, 19.11.2026 (SIM и банк); docs/00 §7",1],["Документы и сроки","Как получить ИНН и СНИЛС?","Оформляем через Госуслуги и ФНС вместе с вами, пароль вы вводите сами. ИНН для карты банк может оформить сам. [проверить]","docs/00 §6 (Core Bundle), §12; решение владельца 17.11.2026",1],["Документы и сроки","Я не подал заявление в RuID. Меня обслужат?","Да, отсутствие RuID у нас ничего не блокирует. Но без заявления могут быть сложности с патентом и учётом, поэтому лучше его подать. [проверить]","docs/00 §1 (п. 5), §12; eec.eaeunion.org",1],["Документы и сроки","Поможете с RuID?","Да, это платная помощь: подскажем, как установить приложение и заполнить заявление. Вход и биометрию на телефоне вы проходите сами, пароли мы не храним.","docs/00 §6, §12",0],["Документы и сроки","Где смотреть свои сроки, чтобы ничего не пропустить?","В приложении «Мой маршрут»: там сроки учёта, патента и медосмотра, и оно напомнит заранее. Поставим его вам прямо здесь.","docs/00 §7",0],["Патент","Когда нужно подать документы на патент?","В течение 30 дней после въезда. [проверить] Если опоздать, при подаче будет штраф. [проверить]","harant.ru",1],["Патент","Какие документы нужны для патента?","Обычно это паспорт, миграционная карта с целью «работа», перевод паспорта, полис ДМС, медзаключение и сертификат об экзамене. [проверить] Точный список для вашего региона подскажет оператор.","glava.klenovskoe-tinao.ru",1],["Патент","Когда проходить медосвидетельствование?","Медосвидетельствование, отпечатки пальцев и фото — в течение 30 дней со дня въезда. [проверить] Можем записать вас в клинику.","docs/00 §7; pnp.ru",1],["Патент","Зачем мне ДМС?","Полис ДМС нужен для патента. [проверить] Оформить его можно у нас — у окна или у стола страховой.","glava.klenovskoe-tinao.ru; office-zia/README",1],["Патент","Нужно ли сдавать экзамен по русскому?","Для патента нужен сертификат об экзамене. [проверить] Сдают только электронно и только в уполномоченных центрах. Мы помогаем подготовиться и записаться, но сдаёте вы сами.","docs/02 §4; rahmat.ru",1],["Патент","Сколько платить за патент каждый месяц?","Каждый месяц вы заранее платите фиксированный налог (НДФЛ). Сумма зависит от региона — оператор посмотрит для вашего. [проверить]","docs/02 §3 (кошелёк патента)",1],["Патент","Как оплатить патент?","Через банк или платёжного партнёра, например с карты. Через кассу нашего офиса патент не оплачивается. Чеки сохраняйте.","docs/02 §4",0],["Патент","Я опоздал с оплатой патента. Что будет?","С 10 августа 2026 года при просрочке патент могут признать недействительным автоматически, без уведомления. [проверить] Приходите с чеками — разберём с юристом, что делать.","harant.ru",1],["Патент","Я из Киргизии. Мне нужен патент?","Гражданам Киргизии патент не нужен: работать можно по договору ЕАЭС. [проверить] Встать на учёт всё равно нужно.","docs/00 §11",1],["SIM и связь","Почему SIM-карту нельзя купить просто так?","Договор на SIM заключается только лично, с проверкой личности через Госуслуги и биометрию — так требует закон о связи.","docs/00 §9",0],["SIM и связь","Где я заключаю договор на SIM?","В системе оператора связи — у нашего окна или у стойки связи, лично. Мы только помогаем.","docs/00 §8, §9",0],["SIM и связь","Сколько номеров мне можно оформить?","Лимит проверяет оператор через госсистему, мы видим только его ответ. По открытым данным, иностранцу — не больше 10 номеров. [проверить]","docs/00 §9; tbank.ru",1],["SIM и связь","Зачем вам IMEI моего телефона?","IMEI записывается в договор. Наберите *#06#, номер появится на экране. Если этот IMEI уже есть у другого клиента, SIM оформить не получится.","docs/00 §9",0],["SIM и связь","Почему SIM оформляют первой?","Для карты банку обычно нужен российский номер, поэтому SIM — первой. [проверить]","office-zia/README (практика, у банков не уточнено)",1],["SIM и связь","Сколько стоит SIM?","Тариф и цену называет оператор связи. Наша помощь — отдельная строка в заявке, цену видно заранее.","docs/00 §5",0],["Карта и деньги","Мне откроют банковскую карту?","Решение принимает только банк. Мы помогаем подготовиться и направляем к столу банка.","docs/00 §4, §9",0],["Карта и деньги","Где сдают биометрию для банка?","Биометрию принимает банк на своём оборудовании. Мы ваше лицо не сравниваем и биометрию не собираем.","docs/00 §6, §9",0],["Карта и деньги","Какие документы нужны для карты?","Обычно паспорт, миграционная карта и российский номер. ИНН банк может оформить сам. [проверить] Точный список — у банка.","sostav.ru; решение владельца 17.11.2026",1],["Карта и деньги","Когда я получу карту?","Срок и форму выдачи определяет банк по своим правилам. Сотрудник банка скажет точно.","docs/00 §6 (поправки)",0],["Карта и деньги","Можно взять деньги в долг на первый месяц?","Можно подать заявку на кредит банка-партнёра до 50 000 ₽. Одобрение не гарантировано — решает банк. [проверить]","решение владельца 17.11.2026 (в docs/00 §6 займы «не в аэропорту»)",1],["Карта и деньги","Почему мне отказали в кредите?","Причину знает только банк, мы на решение не влияем. За кредит, который не оформлен, вы нам не платите. [проверить]","решение владельца 17.11.2026; office-zia/README",1],["Карта и деньги","Как отправить деньги домой?","Через банк-партнёра. Какие направления сейчас работают, уточним у банка: перевод в Таджикистан нужно проверить отдельно. [проверить]","docs/02 §4 (переводы)",1],["Карта и деньги","Можно ли оплатить у вас картой?","Да: банковской картой у терминала или по QR-коду. Чек выдаём. [проверить]","office-zia/README; docs/00 §8 (единый чек — проверить с бухгалтером)",1],["Жильё и регистрация","Где жить первые дни?","Можем забронировать хостел. Встать на учёт по хостелу можно только при брони и если вы там действительно живёте.","docs/00 §6 (поправки)",0],["Жильё и регистрация","Вы гарантируете регистрацию?","Нет. Учёт возможен только при брони и фактическом заселении, а уведомление подаёт принимающая сторона. [проверить]","docs/00 §6; ppt.ru",1],["Жильё и регистрация","Можно купить регистрацию по объявлению?","Не делайте этого, если вы там не живёте: это нарушение, и отвечать придётся вам. [проверить]","",1],["Жильё и регистрация","Что такое «Амина»?","В Москве и области учёт оформляют через приложение «Амина». [проверить] Поможем установить и подготовить, а вход вы делаете сами.","docs/00 §7, §12; vk.ru",1],["Жильё и регистрация","Довезёте до жилья или работы?","Можем забронировать трансфер. Если его оплатил работодатель, с вас за него не берём.","docs/00 §5, §6",0],["Работа","Что работодатель увидит обо мне?","Только профессию, регион и отметку, что документы проверены. Имени и телефона он не видит.","docs/00 §7; CLAUDE.md («Правила данных»)",0],["Работа","Когда работодатель узнает моё имя и телефон?","Только после вашего согласия на конкретного работодателя. Другим работодателям их не передаём.","docs/00 §7",0],["Работа","Работодатель увидит мой паспорт или карту?","Нет. Паспорт и банковские данные работодателю не передаются никогда.","docs/00 §7",0],["Работа","Я передумал искать работу. Можно убрать анкету?","Да, отзовите согласие в любой момент: анкета снимается с портала, обработка данных останавливается.","docs/00 §9 (ПДн)",0],["Работа","Что значит «документы проверены»?","Мы проверили ваши документы. Это не официальное разрешение на работу: право работать подтверждают патент и другие документы. [проверить]","docs/00 §6 (поправки: два статуса); docs/01 Ю10",1],["Работа","Нужно платить за поиск работы?","Нет, анкета на портале для вас бесплатная, подбор оплачивает работодатель. [проверить]","docs/02 §1; docs/00 §5",1],["Работа","Можно работать где угодно?","Нет, в Московской области иностранцам запрещены некоторые виды работ. Вакансии на портале проверяются по региону и виду работы. [проверить]","docs/00 §9 (HR-портал, 390-ПГ — вторичн.)",1],["Работа","Работодатель хочет забрать паспорт или удерживать часть зарплаты. Это нормально?","Паспорт отдавать не нужно. Удержания из зарплаты — только по вашему добровольному заявлению, и отказ не должен влиять на работу. [проверить] Если давят — звоните в нашу правовую помощь.","docs/00 §10",1],["Наши услуги и цены","Обязательно брать все услуги?","Нет, все услуги по выбору. Рекомендуемый пакет можно взять целиком или отказаться от любой строки.","docs/00 §5, §6",0],["Наши услуги и цены","За что я плачу?","Только за нашу помощь и только за то, что реально оформлено. Цены видно в заявке до подписи.","docs/00 §5; office-zia/README («Итог и оплата»)",0],["Наши услуги и цены","Почему за эту услугу с меня не берут денег?","Её оплатил работодатель или партнёр. В заявке у каждой строки видно, кто платит.","docs/00 §5",0],["Наши услуги и цены","Госуслуги же бесплатные. За что деньги?","Да, сами госуслуги бесплатные. Мы берём плату только за помощь в оформлении, и только если вы её выбрали.","docs/00 §5",0],["Наши услуги и цены","Проверка по реестру и штрафам платная?","Базовая проверка (запрет на въезд, реестр, штрафы, приставы) бесплатная. Платно — только разбор и урегулирование того, что нашли. [проверить]","docs/02 §3 (п. 2); решение владельца 17.11.2026; notes/rkl-research §«Почему проверки бесплатные»",1],["Наши услуги и цены","Что я подписываю?","Отдельно: соглашение об электронных документах (ручкой, один раз), заявку и согласия нашей компании. Документы банка и связи подписываются в их системах. Каждый документ можно прочитать до подписи.","docs/00 §8",0],["Наши услуги и цены","Сколько времени это займёт?","В среднем около 25 минут: банк, связь и оператор. [проверить] Если у вас тяжёлый багаж или трудно подниматься по лестнице — скажите, поможем.","docs/00 §3 (оценка, нужен замер)",1],["Наши услуги и цены","Мне что-то не нравится. Кому сказать?","Позовите старшего смены — он в офисе всё время.","docs/00 §3",0],["Если отказали","Банк отказал в карте. Что теперь?","Решение банка мы изменить не можем, причину знает банк. Можно попробовать другой банк-партнёр, за неоформленное вы не платите. [проверить]","docs/00 §9; office-zia/README",1],["Если отказали","Не получилось оформить SIM. Почему?","Чаще всего — лимит номеров или IMEI уже занят. Причину сообщает оператор связи, за неоформленное вы не платите.","docs/00 §9; office-zia/README",0],["Если отказали","Мне отказали в патенте. Что делать?","Причина указана в решении МВД. Принесите его — правовая помощь разберёт, что можно сделать. [проверить]","docs/00 §6 (Post-onboarding: правовая помощь)",1],["Если отказали","Проверка показала, что я в реестре контролируемых лиц. Что это?","Это не официальная справка. Часто запись остаётся, потому что данные не обновились после выезда; поможем перепроверить и подскажем, как урегулировать. [проверить]","docs/02 §4; notes/rkl-research §1; consultant.ru",1],["Если отказали","Вы можете убрать меня из реестра?","Обещать исключение не может никто — решает МВД. Мы поможем перепроверить и подготовить обращение через юриста. [проверить]","docs/02 §4 («Чего не копировать»)",1],["Если отказали","Что мне нельзя, пока я в реестре?","Банк откажет в открытии счёта, есть и другие ограничения. [проверить] Поэтому карту и кредит оформим после исключения из реестра.","notes/rkl-research §4; consultant.ru",1],["Если отказали","Чем запрет на въезд отличается от реестра?","Это две разные проверки: из реестра могут исключить, а запрет на въезд будет действовать. [проверить] Если найден запрет, оформление останавливаем и объясняем, куда обратиться.","notes/rkl-research §3; решение владельца 17.11.2026",1],["Если отказали","Есть страховка от депортации?","Такой страховки у нас нет. Есть правовая помощь 24/7.","docs/00 §6 (поправки)",0],["Безопасность","Кому можно сказать пароль от Госуслуг?","Никому. Пароль вы вводите сами на своём телефоне, наши сотрудники его не спрашивают и не хранят.","docs/00 §12",0],["Безопасность","Мне звонят «из Госуслуг» и просят код из SMS. Что делать?","Положите трубку и код не называйте: Госуслуги сами не звонят. [проверить] Если код уже назвали — сразу скажите оператору.","ppt.ru",1],["Безопасность","Просят дать карту или PIN-код за деньги. Можно?","Нет. Не передавайте карту, PIN-код и данные карты и не принимайте на неё чужие деньги: счёт могут заблокировать, а отвечать придётся вам. [проверить]","docs/00 §5 (контроль дроп-карт — вторичн.)",1],["Безопасность","Вы оставите себе мой паспорт?","Нет, паспорт всё время у вас. Мы только сканируем страницу с данными.","docs/00 §3, §10",0],["Безопасность","Кто видит мои данные?","Только сотрудники, которым они нужны для работы. На табло — только номер талона и окно.","CLAUDE.md («Правила данных»); docs/00 §9",0],["Безопасность","В Telegram обещают патент без экзамена или «снятие с реестра». Верить?","Нет. Гарантировать патент или исключение из реестра никто не может — решает государство.","docs/02 §4 («Чего не копировать»)",0]];
// ===== «Мой маршрут», часть 2: сервисы, которые есть у похожих приложений (справка notes/migrant-needs-one-window-2026-11-20.md, §3 и §5;
// обзор конкурентов 25.11.2026 — README): проверки, доступы (Госуслуги, ИНН, СНИЛС, ЕБС, «Амина»), помощь и SOS, чат с офисом и ответы,
// места, переводы домой, тренажёр экзамена, калькуляторы, заказ услуг. Все правовые утверждения — с [проверить]; данные вымышленные.

// ----- Проверки: бесплатная базовая (решение владельца 17.11.2026) — открытые источники, «не официальная справка»
function checks(){
  const m=at('month'),late=S.st==='late',when=m?(late?'18.01 · 09:00':'10.01 · 09:00'):at('done')?'25.11 · 12:12':'25.11 · 05:49';
  const L=[
    {k:'ban',t:'Запрет на въезд',src:'сервис МВД',r:'не найден',c:'g'},
    {k:'rkl',t:'Реестр контролируемых лиц',src:'сервис МВД',r:'не найден',c:'g'},
    {k:'fine',t:'Штрафы',src:'открытые базы',r:at('month')?'не найдены':'не найдены',c:'g'},
    {k:'fssp',t:'Долги у приставов',src:'банк данных ФССП',r:'не найдены',c:'g'}];
  if(m)L.push({k:'pat',t:'Патент',src:'по вашим чекам и Госуслугам',r:late?'оплаченный период закончился':'оплачен до '+fd(payDue()),c:late?'r':'g'});
  return {when,L};
}

  return `<input class="inp srch" id="faqQ" placeholder="Поиск: патент, SIM, штраф…" value="${esc(S.faqQ||'')}" autocomplete="off">`+
    (L.length?cats.map(c=>{const it=L.filter(([x])=>x[0]===c);return it.length?`<div class="sec">${c}</div><div class="card">${it.map(([x,i])=>`<button class="faq${S.faqOpen===i?' on':''}" data-faq="${i}"><b>${esc(x[1])}</b>${S.faqOpen===i?`<span>${esc(x[2])}</span>`:''}</button>`).join('')}</div>`:''}).join('')
      :'<p class="t mut" style="margin-top:14px">Не нашли — напишите в чат, ответит оператор.</p>')+`<p class="tiny">Ответы — черновик офиса; помеченные [проверить] ждут юриста.</p>`;
}

// ----- Действия новых разделов. Возвращает true, если действие обработано
function act2(a,t){
  switch(a){
    case 'sos':case 'checks':case 'chat':case 'places':case 'money':case 'exam':case 'calc':case 'order':case 'resume':S.sheet=a;render();return true;
    case 'ckauto':S.ckAuto=!S.ckAuto;render();return true;
    case 'recheck':if(S.ckBusy)return true;S.ckBusy=true;render();setTimeout(()=>{S.ckBusy=false;render();toast('Проверено — ограничений не найдено')},1400);return true;
    case 'chatTab':S.chatTab=t.dataset.v;render();return true;
    case 'chatSend':{const i=document.getElementById('chatIn'),v=(i&&i.value||'').trim();if(!v)return true;const n=now(),tm=two(n.getHours())+':'+two(n.getMinutes());
      (S.chat=S.chat||[]).push(['me',tm+(S.off?' · ждёт сети':''),v]);render();
      if(!S.off)setTimeout(()=>{S.chat.push(['op',tm,'Приняли вопрос, оператор ответит в течение 15 минут · демо']);if(S.sheet==='chat')render()},1200);return true}
    case 'quizAgain':S.quiz={i:0,ok:0,pick:null};render();return true;
    case 'quizNext':S.quiz.i++;S.quiz.pick=null;render();return true;
    case 'ordSend':S.ordSent=[...S.ord].map(i=>ORDER[i][1]);S.ord=new Set();S.sheet=null;render();toast('Отправлено в офис: '+S.ordSent.length+' · оператор подготовит');return true;
  }
  return false;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-qpick],[data-ord],[data-faq],[data-msum],[data-creg],[data-cmon],[data-rprof],[data-rexp],[data-rru],[data-vf]');if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.qpick!=null){const z=S.quiz;z.pick=+d.qpick;if(z.pick===QUIZ[z.i].a)z.ok++}
  if(d.ord!=null){S.ord=S.ord||new Set();const i=+d.ord;S.ord.has(i)?S.ord.delete(i):S.ord.add(i)}
  if(d.faq!=null){S.faqOpen=S.faqOpen===+d.faq?null:+d.faq}
  if(d.msum)S.mSum=+d.msum;
  if(d.creg)S.cReg=d.creg; if(d.cmon)S.cMon=+d.cmon;
  if(d.rprof)S.res.prof=d.rprof; if(d.rexp)S.res.exp=d.rexp; if(d.rru)S.res.ru=d.rru;
  if(d.vf)S.vf=d.vf;
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='faqQ'){S.faqQ=t.value;S.faqOpen=null;const p=t.selectionStart;render();const n=document.getElementById('faqQ');n.focus();n.setSelectionRange(p,p)}
  if(t.id==='mSum'){t.value=t.value.replace(/\D/g,'').slice(0,7);S.mSum=+t.value||0;const p=t.selectionStart;render();const n=document.getElementById('mSum');n.focus();n.setSelectionRange(p,p)}
  if(t.id==='cEnt'&&t.value){S.cEnt=t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn')act2('chatSend',e.target)});


// ======================================================================================================
// Действия
function setSt(k){
  S.st=k;S.sheet=null;S.call=false;S.back=false;
  if(k==='login'){S.lg={step:'lang',lang:S.lg.lang,code:'',dob:['','',''],tries:5,err:'',scan:0}}
  if(k==='late'||k==='month'){S.pay.extra=0;S.pay.hist=null}
  if(k!=='month'){S.hr.consent=null}
  if(k==='late'&&S.tab==='job')S.tab='route';
  render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-st],[data-a],[data-tab],[data-lang],[data-rem],[data-resp],[data-mon]');if(!t||t.disabled)return;
  const L=S.lg;
  if(t.dataset.st)return setSt(t.dataset.st);
  if(t.dataset.tab){S.tab=t.dataset.tab;S.sheet=null;render();$('#scr .body')&&($('#scr .body').scrollTop=0);return}
  if(t.dataset.lang){L.lang=t.dataset.lang;return render()}
  if(t.dataset.rem){const k=t.dataset.rem;S.remind[k]=!S.remind[k];render();return toast(S.remind[k]?'Напоминание включено':'Напоминание выключено')}
  if(t.dataset.resp){S.hr.resp.add(t.dataset.resp);render();return toast('Отклик отправлен — без имени и телефона')}
  if(t.dataset.mon){S.pay.months=+t.dataset.mon;return render()}
  const a=t.dataset.a;
  switch(a){
    case 'theme':S.theme=S.theme==='dark'?'light':'dark';sessionStorage.setItem('mr-theme',S.theme);return render();
    case 'off':S.off=!S.off;return render();
    case 'demo':S.sheet='demo';return render();
    case 'lg-next':L.step='how';L.err='';return render();
    case 'lg-how':L.step='how';L.err='';L.scan=0;return render();
    case 'lg-scan':L.step='scan';L.scan=1;render();clearTimeout(L.tm);
      L.tm=setTimeout(()=>{if(S.lg.step!=='scan')return;L.scan=2;render();L.tm=setTimeout(()=>{if(S.lg.step!=='scan')return;L.step='dob';L.err='';render();focusDob()},900)},1700);return;
    case 'lg-code':{const v=($('#code').value||'').toUpperCase().replace(/\s/g,'');L.code=v;
      if(!v){L.err='Введите номер с талона';return render()}
      if(v!==C.code&&v.replace('-','')!==C.code.replace('-','')){L.err='Талон не найден. Проверьте буквы и цифры: 0 и O, 1 и I.';return render()}
      if(S.off){L.err='Нет сети — номер проверим, когда появится связь.';return render()}
      L.step='dob';L.err='';render();return focusDob()}
    case 'lg-dob':{const [d,m,y]=L.dob;if(!d||!m||y.length<4){L.err='Заполните день, месяц и год';return render()}
      if(two(+d)+'.'+two(+m)+'.'+y!==C.dob){L.tries--;L.err=L.tries>0?'Не совпадает с данными у агента. Осталось попыток: '+L.tries:'Попытки закончились';return render()}
      S.st='pre';S.tab='route';render();return toast('Вход выполнен · талон сохранён')}
    case 'close':S.sheet=null;return render();
    case 'ticket':case 'bring':case 'way':case 'memo':case 'rcp':case 'ooo':case 'consent':case 'officeinfo':case 'profile':case 'addchk':S.sheet=a;return render();
    case 'notif':S.sheet='notif';S.seen[S.st]=notifs().length;return render();
    case 'pay':S.sheet='pay';S.pay.months=1;return render();
    case 'pass':S.showPass=!S.showPass;return render();
    case 'autopay':S.autopay=!S.autopay;render();return toast(S.autopay?'Автоплатёж включён · демо':'Автоплатёж выключен');
    case 'call':S.call=true;render();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}return;
    case 'go':S.call=false;S.st='desk';S.tab='route';render();return toast('Окно 15 ждёт вас');
    case 'backwin':S.back=true;render();return toast('Оператор окна 15 увидел, что вы вернулись');
    case 'paid':{if(S.pay.busy)return;const m=+(t.dataset.m||S.pay.months);S.pay.busy=true;render();
      setTimeout(()=>{S.pay.busy=false;const from=payDue();S.pay.extra+=m;(S.pay.hist=S.pay.hist||[]).unshift({d:fd(now()),t:rub(PAT.rate*m)+' · '+m+' мес',s:'оплачено до '+fd(payDue())});
        S.sheet=null;render();toast('Чек учтён · оплачено до '+fd(payDue()))},1300);return}
    case 'cok':S.hr.consent='ok';S.hr.when='10.01 '+two(now().getHours())+':'+two(now().getMinutes());S.sheet=null;render();return toast('Контакты переданы только ООО «СтройДемо»');
    case 'cno':S.hr.consent='no';S.sheet=null;render();return toast('Отказано — работодатель видит только карточку');
    case 'revoke':S.hr.consent='no';render();return toast('Разрешение отозвано');
    case 'hrshow':S.hr.show=!S.hr.show;render();return toast(S.hr.show?'Карточка снова видна работодателям':'Карточка скрыта от работодателей');
    case 'lang2':S.sheet=null;setSt('login');return;
    case 'logout':return setSt('login');
    default:act2(a,t);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='code'){S.lg.code=t.value}
  if(t.dataset.dob!=null){const i=+t.dataset.dob;t.value=t.value.replace(/\D/g,'');S.lg.dob[i]=t.value;
    if(t.value.length===(i===2?4:2)&&i<2){const n=document.querySelector(`[data-dob="${i+1}"]`);n&&n.focus()}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){if(e.target.id==='code')document.querySelector('[data-a="lg-code"]').click();if(e.target.dataset.dob!=null)document.querySelector('[data-a="lg-dob"]').click()}
  if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}
});
function focusDob(){setTimeout(()=>{const i=document.querySelector('[data-dob="0"]');i&&i.focus()},30)}

// масштаб телефона под окно; узкий экран — приложение во весь экран
function fit(){
  const mob=innerWidth<760||(innerHeight<520&&matchMedia('(pointer:coarse)').matches);document.body.classList.toggle('mob',mob);
  const ph=$('#phone');if(mob){ph.style.transform='';return}
  const k=Math.min(1,(innerHeight-40)/872,(innerWidth-300-40)/418);ph.style.transform=`scale(${k})`;
}
addEventListener('resize',fit);
S.theme=sessionStorage.getItem('mr-theme')||'dark';
const q0=new URLSearchParams(location.search);
if(q0.get('st')&&ST.some(x=>x.k===q0.get('st'))){S.st=q0.get('st')}
if(q0.get('tab'))S.tab=q0.get('tab');
if(q0.get('theme'))S.theme=q0.get('theme');
fit();render();
</script>
