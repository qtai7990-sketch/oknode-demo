<!doctype html>

<!-- Макет HR-портала (26.11.2026). Исходник — этот файл и parts/*.js, сборка node build.mjs → hr-portal.html.
     Правила: hr-portal/CLAUDE.md «Правила данных» и «Комплаенс», docs/01 §HR и Ю10: карточка без ФИО и телефона,
     контакт — только после согласия на конкретного работодателя, паспорт и банк — никогда. Данные вымышленные. -->
<style>
/* Переменные оформления трёх макетов: agent-neon (Душанбе), agent-zia (Жуковский), office-zia (окно оператора).
   Один источник: сборка каждого макета (build.mjs) вставляет этот файл на место метки __TOKENS__ в стилях.
   Светлая тема — другие значения тех же переменных (блоки :root[data-theme="light"]), а не отдельные правила.
   Новый цвет, эффект или размер — сюда, в оба набора; в правилах — только var(--…). Правишь файл — пересобери все три макета:
   node tools/look/build-all.cjs. Сверка вида с эталоном — tools/look/snap.cjs и diff.cjs; счёт цветов числом — tools/look/inventory.cjs.

   Что где лежит (сверху вниз):
   1. Цвета и эффекты тёмной темы, затем светлой — основа: фон, линии, текст, акценты, свечение, тени, стекло.
   2. Детали оформления, у которых в светлой теме другое значение. Сначала общие по смыслу (--tone-*-ink, --card-bg, --control-bg…),
      потом по файлам: общие стили, агент в Жуковском, окно оператора. Имя детали — от селектора и свойства.
   3. То, что не зависит от темы: маски, страница чужого сайта в окне партнёра, фирменные цвета партнёров, бумага миграционной карты, окно камеры.
   4. Размеры: радиусы, высота кнопки и поля, шапка, меню, кружок шага. */
:root{
  /* Тёмная тема (по умолчанию). Все цвета — здесь; светлая тема переопределяет их ниже. */
  /* фон и поверхности */
  --bg:#060b17; --bg-rgb:6 11 23;
  --surface:#0a1427; --surface-2:#07101f;
  --panel:#0d1830cc; --panel-solid:#0e1a33;
  --sheet:#0b1528; --sheet-a:#0b1528ee; --hover:#12264a;
  --cnt-on-fg:#fff; --cnt-on-bg:rgb(4 18 48 / .42);
  --header:#07101fcc; --side-bg:#07101f99;
  --overlay:#030813; --scrim:#02060fcc; --desk:#02050c; --bezel:#05080f;
  /* линии */
  --line:#1d3358; --line-rgb:29 51 88; --line2:#27477a;
  --grid-line:#ffffff06; --fill-soft:#ffffff08;
  /* текст */
  --text:#e8f1ff; --text-2:#c4d6f2; --text-hi:#fff; --muted:#8aa0c4; --dim:#7388ab;
  --nav-text:#c3d3ee; --text-hl:#cfe4ff;
  /* акценты и статусы: успех — green, предупреждение — amber, ошибка — red */
  --cyan:#2fd3ff; --cyan-rgb:47 211 255; --cyan-hi:#bfefff; --cyan-soft:#9fe9ff; --cyan-mid:#7fe7ff;
  --blue:#1f7bff; --blue-rgb:31 123 255;
  --green:#19f0a0; --green-rgb:25 240 160; --green-2:#2fe8c8; --green-hi:#bff5df;
  --amber:#ffb547; --amber-rgb:255 181 71; --amber-hi:#ffd9a0; --amber-hi2:#ffe7c2; --amber-mid:#e9c48a;
  --violet:#b48cff; --violet-rgb:180 140 255;
  --red:#ff8a9a; --red-rgb:255 93 115;
  --on-accent:#04101f; --on-green:#03140e;
  --gold-a:#ffd27a; --gold-b:#b88a2e;
  /* синяя кнопка и выбранный пункт меню */
  --blue-a:#2b80ff; --blue-b:#1d5fe0; --blue-c:#153e9f; --on-blue:#fff;
  --blue-ring:#6fb0ff77; --blue-hl:#9cc9ff66; --blue-inner:#0a1f6b55; --blue-edge:#0a1f6b; --blue-drop-rgb:31 91 255;
  /* заголовок, знак, картинка в боковой панели */
  --title-a:#fff; --title-b:#bfe6ff;
  --mark-a:#1b52e8; --mark-b:#2f9bff; --mark-c:#b8f3ff; --mark-t:#7fe7ff;
  --route-tint:#2458c8; --route-filter:grayscale(1) brightness(1.02) contrast(1.1); --route-opacity:.8;
  --route-mask:linear-gradient(180deg,transparent 4%,#000 48%); --route-shade:linear-gradient(180deg,transparent 62%,rgb(var(--bg-rgb) / 0.73) 88%,rgb(var(--bg-rgb) / 0.93) 100%);
  /* окно камеры и страница паспорта */
  --vp-a:#12295a; --vp-b:#040a17; --pp-a:#eef2f8; --pp-b:#d6dfec; --pp-line:#a7b6cd; --pp-hatch:#cad5e4; --pp-hatch2:#dde5f0; --pp-ink:#4b6388;
  /* свечение (--gk) и тени (--sk, --shadow-rgb): в светлой теме свечение гаснет, тени мягче */
  --gk:1; --sk:1; --shadow-rgb:0 0 0;
  --glow:0 0 0 1px rgb(var(--cyan-rgb) / .33), 0 0 24px rgb(var(--blue-rgb) / .33), inset 0 0 18px rgb(var(--blue-rgb) / .13);
  --panel-shadow:0 0 transparent; --card-shadow:0 0 transparent; --lift:0 0 transparent;
  --tile-glow:drop-shadow(0 0 5px currentColor);
  --sig-ink:#e9fbff; --sig-glow:rgb(47 211 255 / .75); --sig-blur:14;
  /* выбранный пункт меню: светящаяся кромка слева, блик и ореол */
  --nav-edge:linear-gradient(180deg,#c8f8ff,#2fd3ff 45%,#1f8fff); --nav-edge-glow:0 0 8px 2px rgb(47 211 255 / .95),0 0 26px 6px rgb(47 211 255 / .5);
  --nav-sheen:radial-gradient(85% 130% at 0% 50%,rgb(120 225 255 / .34),transparent 62%),linear-gradient(180deg,rgb(255 255 255 / .14),transparent 48%);
  --nav-halo:0 0 30px rgb(47 211 255 / .36),0 0 0 1px rgb(127 220 255 / .45);
  /* аватар, уголки сканера, значки */
  /* нижняя панель: стекло с лёгким градиентом */
  --foot-glass:linear-gradient(90deg,rgb(13 24 48 / .5),rgb(14 26 51 / .84) 62%,rgb(14 26 51 / .94)); --foot-line:var(--line); --foot-shadow:0 -8px 30px rgb(0 0 0 / .28);
  /* тон фото агента, подложки карточек, контур плиток QR */
  --ava-tone:rgb(47 140 255 / .16); --ava-filter:saturate(1.02) contrast(1.02);
  --wm-color:var(--cyan); --wm-op:.13; --wm-blur:2.2px; --wmi-op:.2;
  --tk-outline:drop-shadow(0 0 .6px rgb(47 211 255 / .75)) drop-shadow(0 0 20px rgb(31 123 255 / .3));
  /* логотип: плитка с градиентом и белым самолётом */
  /* QR: белая плитка, тёмные модули, синие «глаза» — одинаково в обеих темах */
  --qr-ink:#0b1730; --qr-eye:#1d3c84;
  /* страница паспорта-образца: бумага с защитной сеткой, как на настоящем документе */
  --pp-paper:radial-gradient(60% 80% at 85% 45%,rgb(205 160 225 / .35),transparent 70%),repeating-radial-gradient(circle at 20% 130%,rgb(140 100 185 / .09) 0 1px,transparent 1px 6px),repeating-radial-gradient(circle at 105% -30%,rgb(190 110 165 / .08) 0 1px,transparent 1px 7px),repeating-linear-gradient(118deg,rgb(150 120 195 / .05) 0 1px,transparent 1px 5px),linear-gradient(135deg,#efe5f4 0%,#f5ebf1 45%,#ebe8f6 78%,#eef0f8 100%);
  --pp-text:#1d1a28; --pp-label:#5f5672; --pp-head:#3b2b5a; --pp-mrz:#16141f; --pp-spec:rgb(180 40 90 / .13);
  --pp-holo-1:#e7a3d6; --pp-holo-2:#f2d27e; --pp-holo-3:#9fdcc0; --pp-holo-4:#8ec9ee; --pp-holo-5:#b69be8;
  --pp-flag-r:#cc0000; --pp-flag-w:#fff; --pp-flag-g:#006600; --pp-flag-c:#f8c300;
  /* маршрут в меню: стеклянная карточка */
  --rt-bg:rgb(10 20 40 / .55); --rt-line:rgb(var(--cyan-rgb) / .18); --rt-shadow:0 8px 20px rgb(0 0 0 / .35);
  --ava-gap:#0a1427; --ava-lift:0 0 transparent; --cr-lift:0 0 0 transparent; --icon:var(--cyan);
  /* бумажный талон и плитки QR одинаковы в обеих темах: камера телефона читает QR одинаково */
  --lg-plane-a:#fff; --lg-plane-b:#b9d8ff; --lg-glow:drop-shadow(0 0 5px rgb(47 211 255 / .55)) drop-shadow(0 6px 10px rgb(10 30 80 / .5));
  --paper:#f3f5f8; --ink:#0b0f17; --ink-2:#1f2937; --ink-3:#4b5563; --ink-sep:#9aa3af; --card-white:#fff;
  --r:16px;
}
/* Светлая тема: для яркого света в зоне вылета. Стиль — светлое «стекло» с лазурным акцентом (образец владельца, 17.11.2026).
   Формы — те же, что в тёмной теме. Текст к фону — от 4,5 : 1: цвет текста акцента (--cyan, --green, --amber…) темнее,
   чем яркая основа того же акцента для заливок, рамок и «пилюль» (--cyan-rgb, --green-rgb, --amber-rgb…). */
:root[data-theme="light"]{
  --lg-plane-a:#4b8fff; --lg-plane-b:#1450d4; --lg-glow:drop-shadow(0 4px 8px rgb(30 90 200 / .28));
  /* фон: сверху почти белый, книзу голубой; нижняя часть однотонная (--bg) — под нижней панелью контент растворяется без шва */
  --bg:#dfe7f8; --bg-rgb:223 231 248; --bg-top:#eef2fc; --bg-mid:#e6ecfa;
  --surface:#fff; --surface-2:#f3f7fe;
  --panel:#ffffffe6; --panel-solid:#fff;
  --sheet:#fff; --sheet-a:#fffffff2; --hover:#e8f0ff;
  --cnt-on-fg:var(--cyan-hi); --cnt-on-bg:#fff;
  --header:#ffffffd9; --side-bg:transparent;
  --overlay:#eaf1fc; --scrim:#12284f52; --desk:#0a1322; --bezel:#0d121b;
  --line:#dbe5f4; --line-rgb:176 196 226; --line2:#c3d2ea;
  --grid-line:transparent; --fill-soft:#e8eef8;
  --text:#0d1b33; --text-2:#2a3b57; --text-hi:#0d1b33; --muted:#4a5f82; --dim:#4b5f82;
  --nav-text:#22324d; --text-hl:#2a3b57;
  /* акценты: текст / яркая основа заливок */
  --cyan:#155ee0; --cyan-rgb:47 124 255; --cyan-hi:#124fc0; --cyan-soft:#124fc0; --cyan-mid:#2f7cff;
  --blue:#1f6ff2; --blue-rgb:47 124 255;
  --green:#036a4d; --green-rgb:16 185 129; --green-2:#0d9488; --green-hi:#065f46;
  --amber:#a8420a; --amber-rgb:255 138 51; --amber-hi:#8f3a08; --amber-hi2:#6f2c05; --amber-mid:#9c3f09;
  --violet:#5b47d6; --violet-rgb:124 108 255;
  --red:#be2443; --red-rgb:255 86 110;
  --on-accent:#fff; --on-green:#fff;
  --gold-a:#ffc267; --gold-b:#c98a1e;
  /* синяя кнопка и выбранный пункт меню: лазурный градиент образца */
  --blue-a:#2d7cf8; --blue-b:#1b66ea; --blue-c:#1153cf; --on-blue:#fff;
  --blue-ring:#8dbbffb3; --blue-hl:#ffffff73; --blue-inner:#0a3aa82e; --blue-edge:#1153cf59; --blue-drop-rgb:27 102 234;
  --title-a:#0d1b33; --title-b:#173f8a;
  --mark-a:#1557e8; --mark-b:#2f86ff; --mark-c:#5cc8ff; --mark-t:#2f9bff;
  --route-tint:#a9c1ea; --route-filter:grayscale(1) brightness(1.12) contrast(1.06); --route-opacity:.82;
  --route-mask:linear-gradient(180deg,transparent 4%,#000 48%); --route-shade:none;
  --vp-a:#f7faff; --vp-b:#d3dff1; --pp-a:#fff; --pp-b:#eef3fb; --pp-line:#b9c9e2; --pp-hatch:#dfe7f4; --pp-hatch2:#eff4fb; --pp-ink:#3f6fd8;
  /* свечения нет, тени мягкие и голубоватые */
  --gk:0; --sk:.22; --shadow-rgb:20 50 110;
  --edge:#4590ff;
  --glow:0 0 0 1px var(--edge), 0 0 0 5px rgb(var(--cyan-rgb) / .12), 0 14px 30px rgb(var(--cyan-rgb) / .18);
  --panel-shadow:0 1px 2px rgb(30 70 150 / .05), 0 14px 34px rgb(40 90 190 / .09);
  --card-shadow:0 1px 2px rgb(30 70 150 / .05), 0 8px 22px rgb(40 90 190 / .08);
  --lift:0 16px 40px rgb(20 50 110 / .16);
  --tile-glow:none;
  --sig-ink:#0e2152; --sig-glow:rgb(47 124 255 / .45); --sig-blur:8;
  /* главное действие: бирюзовый градиент с бликом, светлая надпись (решение владельца). Оттенок чуть глубже образца:
     белый на ярко-бирюзовом даёт 1,9–2,4 : 1, на этом — около 3 : 1; тень под буквами помогает читать */
  --cta-a:#0b97ad; --cta-b:#13ab9c; --cta-text:#fff; --cta-rgb:22 176 196;
  /* мягкий блик «стекла» в шапке и наверху страницы */
  --sheen:linear-gradient(108deg,transparent 0%,rgb(255 255 255 / .85) 6%,transparent 15%,transparent 22%,rgb(255 255 255 / .35) 27%,transparent 32%,transparent 40%,rgb(255 255 255 / .7) 49%,transparent 58%,transparent 72%,rgb(255 255 255 / .62) 82%,transparent 91%);
  /* выбранный пункт меню: только блик сверху */
  /* те же блики на всю страницу: шире и реже, растянуты сверху вниз */
  --sheen-page:linear-gradient(115deg,transparent 0%,rgb(255 255 255 / .55) 9%,transparent 20%,transparent 30%,rgb(255 255 255 / .26) 37%,transparent 44%,transparent 54%,rgb(255 255 255 / .48) 64%,transparent 75%,transparent 83%,rgb(255 255 255 / .34) 91%,transparent 99%);
  --nav-edge:transparent; --nav-edge-glow:none; --nav-sheen:linear-gradient(180deg,rgb(255 255 255 / .26),transparent 52%); --nav-halo:0 0 0 transparent;
  /* аватар, уголки сканера, значки одного цвета */
  --foot-glass:linear-gradient(90deg,rgb(255 255 255 / .42),rgb(255 255 255 / .8) 62%,rgb(255 255 255 / .92)); --foot-line:#fff; --foot-shadow:0 0 0 1px rgb(var(--line-rgb) / .42),0 -6px 26px rgb(40 90 190 / .08),0 14px 30px rgb(40 90 190 / .12);
  --ava-tone:rgb(80 140 255 / .12); --ava-filter:saturate(1.02);
  --rt-bg:rgb(255 255 255 / .62); --rt-line:#fff; --rt-shadow:0 8px 20px rgb(40 90 190 / .12);
  --wm-color:var(--icon); --wm-op:.11; --wm-blur:1.8px; --wmi-op:.17;
  --tk-outline:drop-shadow(0 0 .6px rgb(70 110 190 / .65)) drop-shadow(0 10px 20px rgb(40 90 190 / .16));
  --ava-gap:#fff; --ava-lift:0 4px 12px rgb(40 90 190 / .28); --cr-lift:0 3px 6px rgb(47 124 255 / .35); --icon:#2a6ef0;
  --pill-a:#e1ecff; --pill-b:#f4f8ff; --pill-line:#c6dafc; --step-bg:#d3e0fa;
  --soft-c:#dfe9ff; --soft-g:#d6f5e5; --soft-a:#fcdcc8; --soft-r:#ffe1e6; --soft-v:#e9e5ff;
  --soft-c-ink:#1b56cc; --soft-g-ink:#0a6644; --soft-a-ink:#5b3322; --soft-r-ink:#a11d38; --soft-v-ink:#4a37c4; --card-line:#e3ebf7; --cb-line:#c2d1e8;
  --r:18px;
}

/* ===== Детали оформления, у которых в светлой теме другое значение: общие по смыслу — у многих деталей сразу. --tone-*-ink: надпись на метке-«пилюле» и цветная надпись статуса (a — внимание, g — готово, c — справка, v — заметка, r — отказ) =====
   Имя — от селектора и свойства: --svc-sel-cb-bg — фон у «.svc.sel .cb». Раньше это были отдельные правила светлой темы. */
:root{
  --mark-on-bg:var(--cyan);
  --card-bg:var(--surface);
  --control-bg:none;
  --track-bg:var(--line);
  --tone-v-ink:var(--violet);
  --tone-g-ink:var(--green);
  --tone-c-ink:var(--cyan);
  --tone-a-ink:var(--amber);
  --tone-r-ink:var(--red);
}
:root[data-theme="light"]{
  --mark-on-bg:linear-gradient(180deg,var(--blue-a),var(--blue-c));
  --card-bg:linear-gradient(180deg,#fff,#f8fbff);
  --control-bg:#fff;
  --track-bg:var(--fill-soft);
  --tone-v-ink:var(--soft-v-ink);
  --tone-g-ink:var(--soft-g-ink);
  --tone-c-ink:var(--soft-c-ink);
  --tone-a-ink:var(--soft-a-ink);
  --tone-r-ink:var(--soft-r-ink);
}

/* ===== Детали оформления, у которых в светлой теме другое значение: общие стили (исходник agent-neon) =====
   Имя — от селектора и свойства: --svc-sel-cb-bg — фон у «.svc.sel .cb». Раньше это были отдельные правила светлой темы. */
:root{
  --th-btn-i-moon-display:none;
  --top-bg:var(--header);
  --top-blur:blur(8px);
  --top-shadow:none;
  --title-line-img:none;
  --tab-brand-mark-line-img:none;
  --net-line:rgb(var(--green-rgb) / 0.27);
  --net-bg:rgb(var(--green-rgb) / 0.06);
  --dot-bg:var(--green);
  --side-line-img:none;
  --nav-cnt-bg:rgb(var(--cyan-rgb) / 0.13);
  --nav-cnt-ink:var(--cyan);
  --steps-line-img:none;
  --step-i-bg:none;
  --step-done-i-bg:none;
  --step-on-ink:var(--text);
  --step-on-i-shadow:0 0 18px rgb(var(--cyan-rgb) / calc(0.67 * var(--gk)));
  --step-on-after-height:2px;
  --step-on-after-r:2px;
  --step-on-after-bg:var(--cyan);
  --step-on-after-shadow:0 0 10px rgb(var(--cyan-rgb) / calc(0.6 * var(--gk)));
  --bar-bg:var(--line);
  --bar-act-bg:linear-gradient(90deg,rgb(var(--cyan-rgb) / 0.8),rgb(var(--blue-rgb) / 0.53) 35%,var(--line) 80%);
  --bar-done-bg:linear-gradient(90deg,rgb(var(--green-rgb) / 0.6),rgb(var(--cyan-rgb) / 0.67));
  --sec-after-bg:linear-gradient(90deg,var(--line),transparent);
  --sec-all-line:rgb(var(--cyan-rgb) / 0.27);
  --sec-all-shadow:none;
  --panel-blur:blur(6px);
  --svc-r:var(--r-xl);
  --svc-sel-bg:linear-gradient(135deg,rgb(var(--blue-rgb) / 0.13),var(--surface) 70%);
  --svc-lock-sel-bg:linear-gradient(135deg,rgb(var(--green-rgb) / 0.07),var(--surface) 70%);
  --svc-lock-sel-shadow:0 0 0 1px rgb(var(--green-rgb) / 0.2),0 0 22px rgb(var(--green-rgb) / calc(0.13 * var(--gk)));
  --svc-sel-cb-shadow:0 0 12px rgb(var(--cyan-rgb) / var(--gk));
  --svc-lock-cb-bg:var(--green);
  --svc-lock-cb-shadow:0 0 12px rgb(var(--green-rgb) / calc(0.53 * var(--gk)));
  --pr-ink:var(--green);
  --var-sel-ink:var(--cyan);
  --track-i-bg:linear-gradient(90deg,var(--green),var(--cyan));
  --track-i-w-bg:linear-gradient(90deg,var(--amber),var(--gold-a));
  --fsum-bar2-i-on-bg:var(--cyan);
  --sheet-bg:var(--sheet);
  --backdrop-blur:none;
  --fr-st-padding:3px 8px;
  --fh-st-padding:4px 9px;
  --fr-st-font-weight:700;
  --st-g-bg:rgb(var(--green-rgb) / 0.08);
  --st-c-bg:rgb(var(--cyan-rgb) / 0.08);
  --st-a-bg:rgb(var(--amber-rgb) / 0.08);
  --otag-o-app-bg:rgb(var(--cyan-rgb) / 0.08);
  --otag-o-ticket-bg:rgb(var(--green-rgb) / 0.07);
  --otag-o-refused-bg:rgb(var(--amber-rgb) / 0.07);
  --otag-o-rkl-bg:rgb(var(--red-rgb) / 0.07);
  --tg-padding:3px 8px;
  --tg-req-bg:rgb(var(--amber-rgb) / 0.09);
  --need-bg:none;
  --ec-ok-bg:rgb(var(--green-rgb) / 0.06);
  --ec-w-bg:rgb(var(--amber-rgb) / 0.07);
  --ec-n-bg:rgb(var(--amber-rgb) / 0.04);
  --chip2-live-bg:rgb(var(--violet-rgb) / 0.07);
  --et-line:rgb(var(--cyan-rgb) / 0.27);
  --et-bg:rgb(var(--cyan-rgb) / 0.06);
  --et-ink:var(--cyan-hi);

}

/* ===== Цвета, которые раньше были только «запасным значением» у несуществующей переменной (одинаковы в обеих темах) ===== */
:root{
  --warn:#f59e0b; --mut:#94a3b8; --good:#22c55e; --acc:#22d3ee;
}

/* ===== Размеры: одинаковы в обеих темах. Только то, что уже играет одну роль во всех трёх макетах =====
   Радиус панели --r задан выше вместе с цветами: он свой у каждой темы (16 и 18). Кегли в переменные не вынесены: единой шкалы нет. */
:root{
  /* радиусы: шкала */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-pill:999px; --r-round:50%;

  --btn-h:56px; --btn-h-sm:44px; --field-h:52px; --tap:48px;
  /* шапка и меню: широкий экран и планшет */
  --top-h:76px; --top-h-tab:52px; --side-w:228px; --side-w-tab:72px;
  /* кружок шага */
  --step-d:30px; --step-d-tab:24px;
}

.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--nav-text);white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo h3,.dlg h3{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.sit{display:flex;flex-direction:column;gap:4px}
.sit button{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--r-lg);border:1px solid transparent;color:var(--nav-text);font-size:13.5px;line-height:1.3;width:100%}
.sit button i{font-style:normal;flex:none;width:22px;height:22px;border-radius:var(--r-round);display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--line2);color:var(--muted);margin-top:-1px}
.sit button small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.sit button:hover{background:linear-gradient(90deg,rgb(var(--blue-rgb) / 0.13),transparent)}
.sit button.on{background:linear-gradient(90deg,var(--blue-a) 0%,var(--blue-b) 45%,var(--blue-c) 100%);color:var(--on-blue);border-color:var(--blue-ring);box-shadow:inset 0 1px 0 var(--blue-hl),0 8px 22px rgb(var(--blue-drop-rgb) / calc(.35 * var(--gk) + .12))}
.sit button.on small{color:rgb(255 255 255 / .8)} .sit button.on i{border-color:#fff;color:#fff;background:rgb(255 255 255 / .16)}
.tgl{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);width:100%}
.sw .k{width:38px;height:22px;border-radius:var(--r-pill);background:var(--fill-soft);border:1px solid var(--line2);position:relative;flex:none;transition:.15s}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--r-round);background:var(--muted);transition:.15s}
.sw.on .k{background:rgb(var(--cyan-rgb) / .25);border-color:var(--cyan)} .sw.on .k::after{left:18px;background:var(--cyan);box-shadow:0 0 8px rgb(var(--cyan-rgb) / calc(.8 * var(--gk)))}
.look{font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;flex-direction:column;gap:6px}
.look li{list-style:none;padding-left:14px;position:relative} .look li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--cyan)}
.look b{color:var(--text-2);font-weight:600}
.demoBtn{display:none;height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--cyan);flex:none;align-items:center}

.app{position:relative;min-width:0;height:100vh;height:100dvh;overflow:hidden}

/* ===== Общие элементы ===== */
.h1{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.15;background:linear-gradient(90deg,var(--title-a),var(--title-b) 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.lead{font-size:14px;color:var(--muted);line-height:1.5;margin-top:4px}
.sec{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin:24px 2px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;box-shadow:var(--panel-shadow);backdrop-filter:blur(10px);min-width:0}
:root[data-theme="light"] .card{background:linear-gradient(180deg,rgb(255 255 255 / .97),rgb(249 252 255 / .88));border-color:var(--surface);box-shadow:var(--panel-shadow),0 0 0 1px rgb(var(--line-rgb) / .4)}
.card.glow{box-shadow:var(--glow);border-color:transparent}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.ch .ic{color:var(--icon);filter:drop-shadow(0 0 6px rgb(var(--cyan-rgb) / calc(.5 * var(--gk))))}
.ch h2{font-size:16px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.mut{color:var(--muted)} .sm{font-size:12.5px} .xs{font-size:11.5px}
p.t{font-size:14px;line-height:1.55;color:var(--text-2)}
p.t+p.t{margin-top:8px}
.chk{color:var(--muted);font-size:11px;font-style:normal;white-space:nowrap}
.pl{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pl.g{color:var(--tone-g-ink);background:var(--soft-g,rgb(var(--green-rgb) / .12));border:1px solid rgb(var(--green-rgb) / .35)}
.pl.a{color:var(--tone-a-ink);background:var(--soft-a,rgb(var(--amber-rgb) / .12));border:1px solid rgb(var(--amber-rgb) / .38)}
.pl.r{color:var(--tone-r-ink);background:var(--soft-r,rgb(var(--red-rgb) / .12));border:1px solid rgb(var(--red-rgb) / .4)}
.pl.c{color:var(--tone-c-ink);background:var(--soft-c,rgb(var(--cyan-rgb) / .1));border:1px solid rgb(var(--cyan-rgb) / .35)}
.pl.d{color:var(--muted);background:var(--fill-soft);border:1px solid var(--line)}
.btn{height:46px;padding:0 18px;border-radius:var(--r-lg);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;transition:filter .15s}
.btn.go{background:var(--btn-go-bg);color:var(--btn-go-ink);box-shadow:var(--btn-go-shadow)}
.btn.blue{background:linear-gradient(90deg,var(--blue-a),var(--blue-b) 50%,var(--blue-c));color:var(--on-blue);box-shadow:inset 0 1px 0 var(--blue-hl),0 8px 24px rgb(var(--blue-drop-rgb) / calc(.35 * var(--gk) + .15))}
.btn.ghost{border:1px solid var(--line2);color:var(--text);box-shadow:var(--btn-ghost-shadow);background:var(--control-bg)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.sm{height:38px;font-size:13.5px;padding:0 14px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;filter:saturate(.4);box-shadow:none}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.lnk{color:var(--cyan);font-weight:600;font-size:13.5px}
.note{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-lg);background:rgb(var(--blue-rgb) / 0.07);border:1px solid rgb(var(--blue-rgb) / 0.2);color:var(--muted);font-size:13px;line-height:1.45;margin-top:12px}
.note svg{color:var(--cyan);margin-top:1px}
.note.a{background:var(--soft-a,rgb(var(--amber-rgb) / .08));border-color:rgb(var(--amber-rgb) / .35);color:var(--text-2)} .note.a svg{color:var(--amber)}
.note.r{background:var(--soft-r,rgb(var(--red-rgb) / .08));border-color:rgb(var(--red-rgb) / .4);color:var(--text-2)} .note.r svg{color:var(--red)}
.note.g{background:var(--soft-g,rgb(var(--green-rgb) / .08));border-color:rgb(var(--green-rgb) / .35);color:var(--text-2)} .note.g svg{color:var(--green)}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid rgb(var(--line-rgb) / .6);width:100%;min-width:0}
.li:last-child{border-bottom:0}
.li .lic{width:38px;height:38px;border-radius:var(--r-lg);display:grid;place-items:center;flex:none;color:var(--icon);background:rgb(var(--cyan-rgb) / .08);border:1px solid rgb(var(--cyan-rgb) / .22)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.li .lt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13.5px}
.fld dt{color:var(--muted)} .fld dd{font-weight:600;overflow-wrap:anywhere}
.fld dd.no{color:var(--dim);font-weight:500}

/* поиск, фильтры, переключатель, телефон */

.fl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.fl select.inp{width:auto;min-width:0;height:40px;flex:1 1 200px;max-width:360px}.fl .chips{flex:1 1 100%}

.agr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:14px;line-height:1.4}.agr+.agr{border-top:1px solid rgb(var(--line-rgb) / .6)}

/* соискатель: переключатель «Я работодатель / Я ищу работу», два пути, шаги регистрации */
.top .aud{flex:none}.aud button{height:34px;padding:0 12px;font-size:13px;white-space:nowrap}.audS{display:none}

/* уведомления */
.nt.un b{color:var(--text-hi)}.udot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgb(var(--cyan-rgb) / .8);flex:none}

/* ===== Публичная часть ===== */
.pub{height:100%;overflow-y:auto;overflow-x:hidden}

.steps .card b{display:block;font-size:15px;margin:10px 0 6px}
.stepn{width:30px;height:30px;border-radius:var(--r-round);display:grid;place-items:center;font-weight:800;color:var(--on-blue);background:linear-gradient(135deg,var(--blue-a),var(--blue-c))}

.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.6}

.mhd .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mtop{display:none}
.cont{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 28px 40px}
.off{display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:var(--r-lg);font-size:13px;color:var(--tone-a-ink);background:var(--soft-a,rgb(var(--amber-rgb) / .1));border:1px solid rgb(var(--amber-rgb) / .35);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid rgb(var(--line-rgb) / .6);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{font-weight:600}
.empty{text-align:center;padding:40px 20px}
.empty .ei{width:64px;height:64px;margin:0 auto 14px;border-radius:var(--r-round);display:grid;place-items:center;color:var(--cyan);background:rgb(var(--cyan-rgb) / .08);border:1px solid rgb(var(--cyan-rgb) / .25)}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:13.5px;max-width:420px;margin:0 auto 16px;line-height:1.5}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--fill-soft),rgb(var(--cyan-rgb) / .12),var(--fill-soft));background-size:200% 100%;animation:sk 1.1s linear infinite;margin:10px 0}

.never{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:10px}

.scrim{position:fixed;inset:0;background:var(--overlay,rgb(0 0 0 / .55));z-index:70;animation:fade .2s}

.dlg{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow:auto;background:var(--sheet-bg,var(--panel-solid));border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--lift);padding:20px;animation:fi .2s}

  .dlg{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-height:92dvh;border-radius:var(--r) var(--r) 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}

    `<dt>Документы</dt><dd>${c.docs?`<span class="pl g">${ico('shield',12)}проверены ${fdd(c.docs)}</span>`:'<span class="pl d">не проверены</span>'}</dd>`+

const TITLE={sum:['Сводка',CO+' · 26.11.2026'],vac:['Вакансии','Размещение бесплатно. Перед публикацией — проверка по региону и сфере'],vacEdit:['Вакансия','Поля со звёздочкой обязательны'],
  cand:['Кандидаты','Карточки без имени и контактов. Порядок — по дате проверки документов, без рейтингов'],resp:['Отклики','Контакты — только после согласия кандидата на вашу компанию'],
  log:['Журнал раскрытий','Кто, когда и что получил. Записи не изменяются'],notif:['Уведомления','Отклики, согласия, проверки'],set:['Настройки','Компания, пользователи кабинета, рассылки']};
const newCnt=()=>S.resp.filter(r=>r.st==='new').length;

  const bn=NAV.slice(0,4).map(([k,t,ic])=>`<button class="${on(k)?'on':''}" data-view="${k}">${ico(ic,22)}<span>${t}</span>${cnt(k)?`<i class="cnt">${cnt(k)}</i>`:''}</button>`).join('')+
    `<button class="${['log','notif','set'].includes(S.view)?'on':''}" data-a="moreNav">${ico('more',22)}<span>Ещё</span>${unread()?`<i class="cnt">${unread()}</i>`:''}</button>`;
  let [tt,ts]=TITLE[S.view];if(S.view==='vacEdit')tt=S.form&&S.form.id?'Изменение вакансии':'Новая вакансия';
  const hact=S.view==='vac'||S.view==='sum'&&S.vacs.length?`<div class="hact"><button class="btn go sm" data-a="newVac">${ico('plus',18)}<span class="lbl">Новая вакансия</span></button></div>`:'';
  let body;

  else if(S.loading)body=`<div class="card">${[90,70,80,55,75].map(w=>`<div class="skel" style="width:${w}%"></div>`).join('')}</div>`;
  else body=({sum:sumView,vac:vacView,vacEdit:formView,cand:candView,resp:respView,log:logView,notif:notifView,set:setView})[S.view]();

    `<button class="nv" data-a="toHome">${ico('globe',19)}<span>Портал</span></button><button class="nv" data-a="logout">${ico('out',19)}<span>Выйти</span></button></aside>`+
    `<div class="main"><div class="mtop">${brandH('')}<span class="grow"></span><button class="demoBtn" data-a="demo">Демо</button><button class="ib" data-view="notif" aria-label="Уведомления">${ico('bell',20)}${unread()?`<i class="dot"></i>`:''}</button></div>`+
    `<div class="mhd"><div class="t"><b>${tt}</b><small>${ts}</small></div>${hact}<button class="demoBtn" data-a="demo">Демо</button></div>`+
    `<div class="cont" id="scroll">${S.off?`<div class="off">${ico('wifioff',16)}<span>Нет сети. Показаны данные на 26.11 09:20. Обновим сами, когда сеть появится.</span></div>`:''}`+
    `${S.pending?`<div class="note a" style="margin:0 0 14px">${ico('clock',18)}<span><b>Компания на проверке</b> — обычно до одного рабочего дня [демо]. Вакансии можно готовить; опубликуются после проверки.</span></div>`:''}<div class="fadein">${body}</div></div>`+
    `<nav class="bnav">${bn}</nav></div></div>`;

const inDays=(d,n)=>d&&daysAgo(d)<n;
function sumView(){
  const pub=S.vacs.filter(v=>v.st==='pub').length;
  let h='';
  if(!S.vacs.length)h+=`<div class="card glow"><div class="ch"><span class="ic">${ico('bag',22)}</span><h2>Начните с вакансии</h2></div><p class="t">Опубликуйте первую вакансию — это бесплатно. Регион и сферу проверим сразу. Потом кандидаты откликнутся без имени и телефона; контакты — после их согласия.</p><div class="row" style="margin-top:14px"><button class="btn go sm" data-a="newVac">${ico('plus',18)}Новая вакансия</button><button class="btn ghost sm" data-view="cand">Посмотреть кандидатов</button></div></div><div style="height:14px"></div>`;
  const per=(n)=>[S.resp.filter(r=>inDays(r.when,n)).length,S.resp.filter(r=>inDays(r.req,n)).length,S.log.filter(e=>e.ev==='g'&&inDays(e.at,n)).length,S.resp.filter(r=>r.st==='no'&&inDays(r.when,n)).length];
  const w=per(7),m=per(30);
  h+=`<div class="stats">${[['Отклики',0,'inbox'],['Запросы контактов',1,'send'],['Контакты открыты',2,'user'],['Отказы',3,'x']].map(([l,i,ic])=>`<div class="card stat"><div class="row" style="color:var(--icon)">${ico(ic,18)}<span class="l">${l}</span></div><div class="n num">${w[i]}</div><div class="l">за 7 дней · за 30 дней — <b class="num">${m[i]}</b></div></div>`).join('')}</div>`;
  const todo=[];
  if(newCnt())todo.push(['inbox',`Новых откликов: ${newCnt()}`,'профессия, опыт и регион — без имени','resp']);
  S.resp.filter(r=>r.st==='wait').slice(0,3).forEach(r=>todo.push(['clock',`Ждём согласия: ${cand(r.c).al}`,'запрос отправлен '+fdt(r.req)+' · ответ придёт сюда','resp']));
  S.resp.filter(r=>r.st==='rev'&&inDays(r.rev,3)).forEach(r=>todo.push(['alert',`${cand(r.c).al} отозвал согласие`,'контакты скрыты из кабинета · '+fdt(r.rev),'resp']));
  S.vacs.filter(v=>v.st==='blocked').forEach(v=>todo.push(['ban','Вакансия остановлена проверкой',v.t,'vac']));
  S.vacs.filter(v=>v.st==='draft').forEach(v=>todo.push(['edit','Черновик не опубликован',v.t,'vac']));
  const byV=S.vacs.filter(v=>v.st==='pub').map(v=>[v,S.resp.filter(r=>r.v===v.id&&inDays(r.when,30)).length]);
  h+=`<div class="grid2" style="margin-top:14px"><div class="card"><div class="ch"><span class="ic">${ico('check',22)}</span><h2>Требует внимания</h2></div>${todo.length?todo.map(([ic,t,s,v])=>`<button class="li" data-view="${v}"><span class="lic">${ico(ic,19)}</span><span class="lt"><b>${esc(t)}</b><small>${esc(s)}</small></span>${ico('chev',18)}</button>`).join(''):'<p class="t mut">Всё разобрано.</p>'}</div>`+
    `<div class="card"><div class="ch"><span class="ic">${ico('bag',22)}</span><h2>Отклики по вакансиям · 30 дней</h2></div>${byV.length?byV.map(([v,n])=>`<div class="li"><span class="lt"><b>${esc(v.t)}</b><small>${esc(v.place)}</small></span><span class="pl c num">${n}</span></div>`).join(''):`<p class="t mut">Опубликованных вакансий пока нет · ${pub}</p>`}`+
    `<div class="never">${ico('ban',15)}<span>Паспорт и банковские данные не передаются никогда.</span></div></div></div>`;
  return h;
}
const vacPill=v=>({pub:['g','опубликована'],draft:['d','черновик'],blocked:['r','остановлена'],closed:['d','снята']})[v.st];

  if(!L.length)return h+emptyBox('inbox','По этим условиям откликов нет','Выберите «Все» или очистите поиск.','');
  return h+`<div class="card" style="padding:6px 16px"><table class="tbl"><thead><tr><th>Кандидат</th><th>Вакансия</th><th>Когда</th><th>Статус</th><th style="width:34%">Контакты</th></tr></thead><tbody>${L.slice(0,S.pg.resp).map(respRow).join('')}</tbody></table></div>`+
    more('resp',Math.min(S.pg.resp,L.length),L.length)+`<div class="never">${ico('ban',15)}<span>Паспорт и банковские данные не передаются никогда — ни в отклике, ни после согласия.</span></div>`;
}
function respRow(r){
  const c=cand(r.c),v=vac(r.v),[pc,pt]=RST[r.st],b=S.busy['q'+r.id];
  let act='';
  if(r.st==='new')act=`<button class="btn blue sm" data-a="reqR" data-r="${r.id}" ${b?'disabled':''}>${b?'Отправляем…':ico('send',16)+'Запросить контакты'}</button>`;
  if(r.st==='wait')act=`<div class="sm mut">Запрос отправлен ${fdt(r.req)}. Кандидат ответит на портале или в «Моём маршруте».</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="dYes" data-r="${r.id}">демо: согласился</button><button class="btn ghost sm" data-a="dNo" data-r="${r.id}">демо: отказал</button></div>`;
  if(r.st==='ok')act=`<div class="contact"><div class="nm">${esc(c.fio)}</div><div class="ph">${c.ph}</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="copy" data-ph="${c.ph}">${ico('copy',16)}Скопировать номер</button><button class="btn ghost sm" data-a="dRev" data-r="${r.id}">демо: отозвал</button></div><div class="xs mut" style="margin-top:8px">Передано только ${CO} · ${fdt(r.at)} · по согласию кандидата на вашу компанию</div></div>`;
  if(r.st==='no')act=`<div class="sm mut">Кандидат отказал. Карточка остаётся без контактов.</div>`;
  if(r.st==='rev')act=`<div class="note r" style="margin-top:0">${ico('lock',18)}<span>Кандидат отозвал согласие ${fdt(r.rev)}. Контакты скрыты из кабинета. Уже полученный номер не используйте ${CHK}.</span></div>`;
  if(c.gone)act=(r.st==='rev'?act:'')+`<div class="note" style="margin-top:${r.st==='rev'?8:0}px">${ico('info',18)}<span>Соискатель удалил анкету. Карточка снята, контакты не передаются.</span></div>`;
  return `<tr><td><span class="al">${c.al}</span><div><b>${esc(c.prof)}</b></div><div class="xs mut">${c.exp} · ${c.reg} · русский ${c.ru}</div><div style="margin-top:4px">${c.docs?`<span class="pl g">${ico('shield',12)}проверены ${fdd(c.docs)}</span>`:'<span class="pl d">не проверены</span>'}</div></td>`+
    `<td data-l="Вакансия">${esc(v?v.t:'—')}<div class="xs mut">${r.how==='отклик'?'отклик кандидата':'ваш запрос'}</div></td><td data-l="Когда" class="num">${fdt(r.when)}</td><td data-l="Статус"><span class="pl ${pc}">${pt}</span></td><td>${act}</td></tr>`;
}

    b=head('Запросить контакты · '+c.al)+`<p class="t">${esc(c.prof)} · ${c.exp} · ${c.reg}</p>`+
      (pubs.length?`<div class="f" style="margin-top:14px"><label for="reqV">На какую вакансию</label><select class="inp" id="reqV" data-reqv>${pubs.map(v=>`<option value="${v.id}"${S.reqV===v.id?' selected':''}>${esc(v.t)}</option>`).join('')}</select></div>`:`<div class="note a">${ico('info',18)}<span>Нет опубликованных вакансий — запрос идёт на конкретную вакансию.</span></div>`)+
      `<div class="note">${ico('lock',18)}<span>Кандидат получит запрос на портале или в «Моём маршруте». Если согласится — вы увидите ФИО и телефон. Разрешение — только для ${CO}: другим работодателям оно не передаётся.</span></div>`+
      `<div class="never">${ico('ban',15)}<span>Паспорт и банковские данные не передаются никогда.</span></div>`+

  if(d==='card'){const c=cand(S.cardC);b=head('Карточка кандидата')+candCard(c).replace('class="card cc"','class="cc"')}
  if(d==='close'){const v=vac(S.closeV);b=head('Снять с публикации?')+`<p class="t">Вакансия «${esc(v.t)}» исчезнет из каталога. Отклики и журнал останутся.</p><div class="row" style="margin-top:16px"><button class="btn go" data-a="closeYes">Снять</button><button class="btn ghost" data-a="dclose">Отмена</button></div>`}
  if(d==='demo')b=head('Демо · ситуации')+`<div style="display:flex;flex-direction:column;gap:18px">${demoHtml(true)}</div>`;
  if(d==='moreNav')b=head('Ещё')+NAV.slice(4).map(([k,t,ic])=>`<button class="li" data-view="${k}"><span class="lic">${ico(ic,19)}</span><span class="lt"><b>${t}</b></span>${k==='notif'&&unread()?`<span class="pl c">${unread()}</span>`:''}${ico('chev',18)}</button>`).join('')+
    `<button class="li" data-a="toHome"><span class="lic">${ico('globe',19)}</span><span class="lt"><b>Портал</b><small>каталог вакансий и компаний</small></span></button><button class="li" data-a="logout"><span class="lic">${ico('out',19)}</span><span class="lt"><b>Выйти</b></span></button>`;
  if(d==='doc')b=head(DOCS[S.doc][0])+`<div class="note a" style="margin-top:0">${ico('info',18)}<span>Демо-текст. Перед запуском его готовит юрист [проверить у юристов].</span></div>`+DOCS[S.doc][1].map(([t,x])=>`<div class="sec" style="margin:16px 0 6px">${t}</div><p class="t">${x}</p>`).join('');
  if(!b&&SDLG[d])b=SDLG[d](head);
  return `<div class="scrim" data-a="dclose"></div><div class="dlg" role="dialog" aria-modal="true">${b}</div>`;
}

  if(k==='s-rev'){r.st='rev';r.rev=ago(0,10,20);S.log.push({at:r.rev,c:r.c,v:r.v,ev:'r'})}
  S.resp.push(r);S.resp.sort((a,b)=>b.when-a.when);S.log.sort((a,b)=>b.at-a.at);
  S.notifs=buildNotifs();
  S.view=k==='s-filled'?'sProf':'sReq';
}

// ----- общая база: отклики соискателя у «СтройДемо» (S.resp — их видит кабинет работодателя) и у других компаний (S.other)
function myResp(){
  if(!S.me)return [];
  const a=S.resp.filter(r=>r.c===S.me.id).map(r=>{const v=vac(r.v);return {...r,e:'e1',jt:v?v.t:'вакансия',job:v&&v.src}});
  const b=S.other.map(o=>({...o,jt:(JOBS.find(j=>j.id===o.job)||{}).t||'вакансия'}));
  return [...a,...b].sort((x,y)=>(y.req||y.when)-(x.req||x.when));
}
const recOf=id=>S.resp.find(r=>r.id===id)||S.other.find(o=>o.id===id);
const appliedTo=jid=>myResp().find(r=>r.job===jid&&r.how!=='запрос');
const reqCnt=()=>myResp().filter(r=>r.st==='wait').length;
const isSeek=()=>SEEKV.includes(S.view);
const SEEKV=['sProf','sJobs','sResp','sReq','sSet','sEdit'];
function notify(n){S.notifs.unshift({...n,at:nowD(),id:'n'+(S.nid++),read:false})}
function doApply(jid){
  const j=JOBS.find(x=>x.id===jid),M=S.me;
  if(j.e==='e1'){const v=S.vacs.find(x=>x.src===jid);

function withdraw(){

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sa],[data-aud],[data-dside],[data-cc],[data-sagr],[data-sfc]');if(!t||t.disabled)return;
  const d=t.dataset,R=S.sr,M=S.me;
  if(d.aud){S.aud=d.aud;return ['home','login','reg','regdone','sreg','slogin'].includes(S.view)?go('home'):render()}
  if(d.dside){S.dside=d.dside;return render()}
  if(d.cc){R.cc=d.cc;R.err='';render();const i=$('#sphone');i&&i.focus();return}
  if(d.sagr){R.agree[d.sagr]=!R.agree[d.sagr];return render()}
  if(d.sfc){const F=SF();F[d.sfc]=d.v;delete F.e[d.sfc];return render()}
  switch(d.sa){
    case 'reg':S.sr=freshSr('reg');S.aud='seek';S.dlg=null;return go('sreg');
    case 'login':S.sr=freshSr('login');S.aud='seek';S.dlg=null;return go('slogin');
    case 'toReg':S.sr={...freshSr('reg'),cc:R.cc,phone:R.phone};return go('sreg');
    case 'toLogin':S.sr={...freshSr('login'),cc:R.cc,phone:R.phone};return go('slogin');
    case 'send':{const v=($('#sphone').value||'').trim(),dg=v.replace(/\D/g,'');R.phone=v;
      if(dg.length!==PH_LEN[R.cc]){R.err='Номер для '+R.cc+' — '+PH_LEN[R.cc]+' цифр, без кода страны';render();const i=$('#sphone');i&&i.focus();return}
      R.err='';return call('sr',700,()=>{R.step='code';R.code='';R.tries=5;sStartTimer();toast('Код отправлен в SMS · демо 1234');setTimeout(()=>{const i=$('#scode');i&&i.focus()},30)})}
    case 'again':if(Date.now()<R.until)return;return call('sr',500,()=>{R.code='';R.err='';R.tries=5;sStartTimer();toast('Новый код отправлен в SMS · демо 1234')});
    case 'code':{const c=($('#scode').value||'').trim();R.code=c;
      if(c.length<4){R.err='Введите 4 цифры из SMS';return render()}
      if(c!=='1234'){R.tries--;R.err=R.tries>0?'Код не подходит. Осталось попыток: '+R.tries:'Попытки закончились — запросите новый код';return render()}
      R.err='';return call('sr',600,()=>{
        if(S.view==='slogin'){let m=S.meLast;if(!m){m={...ME0(),id:'cl'+(S.nid++),cc:R.cc,phone:R.phone,ph:R.cc+' '+R.phone};S.seekers.push(m)}S.me=m;S.meLast=null;S.aud='seek';afterEnter('Вход выполнен')}
        else{R.step='name';setTimeout(()=>{const i=$('#sfio');i&&i.focus()},30)}})}
    case 'back':R.step='phone';R.err='';return render();
    case 'nameOk':{const v=($('#sfio').value||'').trim(),m=($('#smail').value||'').trim();R.fio=v;R.mail=m;const E={};
      if(!/^[\p{L}][\p{L}\s'’.-]{2,79}$/u.test(v)||!/\p{L}{2,}/u.test(v))E.fio='Только буквы: фамилия и имя, без телефона и почты';
      if(!MAIL_RE.test(m))E.mail='Проверьте почту: нужен вид имя@домен';
      if(Object.keys(E).length){R.e=E;render();const i=$(E.fio?'#sfio':'#smail');i&&i.focus();return}
      R.e={};R.step='form';render();const s=$('#scroll');s&&(s.scrollTop=0);return}
    case 'toName':R.step='name';R.e={};return render();
    case 'create':{const E=anketaErr(R);R.e=E;if(Object.keys(E).length){render();const i=$('#sf_'+Object.keys(E)[0]);i&&i.focus();return}
      return call('sr',900,()=>createMe())}
    case 'me':S.aud='seek';return go(reqCnt()?'sReq':'sProf');
    case 'home':S.aud='seek';return go('home');
    case 'logout':S.meLast=S.me;S.me=null;S.aud='seek';go('home');return toast('Вы вышли из кабинета соискателя');
    case 'apply':if(!M){S.pendJob=d.j;S.sr=freshSr('reg');S.aud='seek';return go('sreg')}
      if(appliedTo(d.j))return toast('Вы уже откликнулись на эту вакансию');
      S.applyJ=d.j;S.dlg='sApply';return render();
    case 'applyGo':if(appliedTo(S.applyJ)){S.dlg=null;return render()}
      return call('apply',800,()=>{doApply(S.applyJ);S.dlg=null;toast('Отклик отправлен — компания увидит анкету без имени и телефона')});
    case 'allow':{const r=recOf(d.r);return call('al'+r.id,700,()=>{r.st='ok';r.at=nowD();const e=emp(r.e||'e1');
      if(r.c){S.log.unshift({at:r.at,c:r.c,v:r.v,ev:'g'});notify({ic:'user',t:M.al+' согласился — контакты открыты',s:'только для '+CO,view:'resp'})}
      toast('Имя и телефон открыты только «'+e.name.replace(/^[^«]*«|»$/g,'')+'»')})}
    case 'deny':{const r=recOf(d.r);return call('dn'+r.id,600,()=>{r.st='no';if(r.c)notify({ic:'x',t:M.al+' отказал в контактах',s:'карточка остаётся без контактов',view:'resp'});toast('Вы отказали — имя и телефон не переданы')})}
    case 'revoke':S.revR=d.r;S.dlg='sRevoke';return render();
    case 'revokeGo':{const r=recOf(S.revR);return call('rv',700,()=>{r.st='rev';r.rev=nowD();
      if(r.c){S.log.unshift({at:r.rev,c:r.c,v:r.v,ev:'r'});notify({ic:'alert',t:M.al+' отозвал согласие',s:'контакты скрыты из кабинета',view:'resp'})}
      S.dlg=null;toast('Согласие отозвано — дальнейшая передача прекращена')})}
    case 'hide':M.hidden=!M.hidden;render();return toast(M.hidden?'Анкета скрыта из поиска':'Анкета снова видна работодателям');
    case 'sms':M.sms=!M.sms;render();return toast(M.sms?'SMS о запросах включены':'SMS о запросах выключены');
    case 'ads':M.ads=!M.ads;render();return toast(M.ads?'Согласие на рекламу дано · отозвать можно здесь':'Согласие на рекламу отозвано');
    case 'edit':S.sf={sph:M.sph,prof:M.prof,reg:M.reg,exp:M.exp,ru:M.ru,cit:M.cit,e:{}};return go('sEdit');
    case 'editSave':{const E=anketaErr(S.sf);S.sf.e=E;if(Object.keys(E).length){render();const i=$('#sf_'+Object.keys(E)[0]);i&&i.focus();return}
      return call('se',600,()=>{const {e:_,...F}=S.sf;Object.assign(M,F);if(M.docs)M.right=rightOf(M);S.view='sProf';toast('Анкета обновлена — компании видят новые данные')})}
    case 'del':S.dlg='sDel';return render();
    case 'delGo':return call('del',800,()=>{withdraw();S.dlg=null;S.view='home';S.aud='seek';toast('Аккаунт удалён · демо')});
    case 'sjFit':S.sjAll=false;S.pg.sjobs=10;return render();
    case 'sjAll':S.sjAll=true;S.pg.sjobs=10;return render();
    case 'docs':if(!M)return toast('Сначала войдите как соискатель — ситуация «Анкета заполнена»',true);
      setDocs(!M.docs);render();return toast(M.docs?'Документы проверены в офисе · демо':'Отметка о проверке снята · демо');
    case 'empCab':S.logged=true;S.aud='emp';S.dlg=null;return go('resp');
    case 'seekCab':S.aud='seek';S.dlg=null;if(S.me)return go(reqCnt()?'sReq':'sProf');S.sr=freshSr('reg');return go('sreg');
  }
});
document.addEventListener('input',e=>{
  const t=e.target,R=S.sr;
  if(t.id==='sphone'){t.value=t.value.replace(/[^\d\s-]/g,'');R.phone=t.value;if(R.err){R.err='';t.classList.remove('bad');const er=t.closest('.f').querySelector('.err');er&&(er.textContent='')}}
  if(t.id==='scode'){t.value=t.value.replace(/\D/g,'').slice(0,4);R.code=t.value}
  if(t.id==='sfio'){R.fio=t.value;if(R.e.fio){delete R.e.fio;t.classList.remove('bad');const er=t.closest('.f').querySelector('.err');er&&(er.textContent='')}}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.sf;if(!k)return;
  const F=SF();F[k]=t.value;delete F.e[k];if(k==='sph'){F.prof='';}render();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const m={sphone:'send',scode:'code',sfio:'nameOk'}[e.target.id];if(m){const b=$(`[data-sa="${m}"]`);b&&b.click()}
});

// ----- HR-портал: отрисовка и действия кабинета и входа (действия каталога и регистрации-галочек — parts/hr3.js)
const nowD=()=>{const d=new Date(NOW);const n=new Date();d.setHours(n.getHours(),n.getMinutes());return d};
const CONTACT_RE=/(\+?\d[\d\s\-()]{8,}\d)|@|https?:|www\./i;
const MAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const isPub=()=>PUB.includes(S.view);
function render(){
  document.documentElement.dataset.theme=S.theme;
  if(isSeek()&&!S.me)S.view='home';
  if(!S.logged&&!isPub()&&!isSeek())S.view='home';
  $('#demo').innerHTML=demoHtml(false);
  const sc=$('#scroll'),y=sc?sc.scrollTop:0,same=S._v===S.view;
  $('#app').innerHTML=isPub()?pubView():isSeek()?seekCabView():cabView();
  const ns=$('#scroll');if(ns&&same)ns.scrollTop=y;
  S._v=S.view;
  $('#ov').innerHTML=dlgView();
}
function toast(t,bad){const e=$('#toast');e.className='toast'+(bad?' bad':'');e.innerHTML=ico(bad?'alert':'check',18)+'<span>'+t+'</span>';requestAnimationFrame(()=>e.classList.add('show'));clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
// переход между разделами: «Ошибка сервера» — экран ошибки с «Повторить», «Медленная сеть» — загрузка
function go(v){
  S.view=v;S.dlg=null;if(v!=='vacEdit')S.form=null;S.err=false;S.loading=false;
  if(!isPub()&&S.fail){S.err=true;return render()}
  if(!isPub()&&S.slow){S.loading=true;render();clearTimeout(go.t);go.t=setTimeout(()=>{S.loading=false;render()},900);return}
  render();const s=$('#scroll');s&&(s.scrollTop=0);
}
// сеть: каждое действие с сервером проходит здесь — нет сети и «ошибка сервера» дают понятный ответ, двойное нажатие отсекается
function call(key,ms,ok,offMsg){
  if(S.busy[key])return;
  if(S.off){toast(offMsg||'Нет сети. Ничего не потеряно — попробуйте, когда сеть появится.',true);return}
  S.busy[key]=true;render();
  setTimeout(()=>{S.busy[key]=false;if(S.fail){render();return toast('Не получилось: сервер не ответил. Введённое сохранено — попробуйте ещё раз.',true)}ok();render()},ms);
}
function newForm(v){S.form=v?{...v}:{id:null,t:'',sph:'',reg:'',place:'',sched:'',from:'',to:'',n:'1',housing:false,meals:false,noexp:false,about:''};S.ferr={};S.chk='idle';if(v)runCheck(true);go('vacEdit')}
function runCheck(quiet){
  const F=S.form;if(!F||!F.reg||!F.sph){S.chk='idle';return quiet||render()}
  if(S.off){S.chk='off';return quiet||render()}
  if(quiet){const r=ruleCheck(F.reg,F.sph);S.chk=r.ok?'ok':'block';S.chkWhy=r.why;return}
  S.chk='busy';render();clearTimeout(runCheck.t);
  runCheck.t=setTimeout(()=>{if(!S.form)return;const r=ruleCheck(S.form.reg,S.form.sph);S.chk=r.ok?'ok':'block';S.chkWhy=r.why;render()},600);
}
function validate(){
  const F=S.form,E={};
  if((F.t||'').trim().length<5)E.t='Назовите должность: например, «Грузчик на склад»';
  else if(CONTACT_RE.test(F.t))E.t='Уберите из названия телефон, почту и ссылки';
  if(!F.sph)E.sph='Выберите сферу деятельности';
  if(!F.reg)E.reg='Выберите регион';
  if(!(+F.from>=10000))E.from='Укажите зарплату числом, не меньше 10 000';
  if(F.to!==''&&F.to!=null&&+F.to&&+F.to<+F.from)E.to='Не меньше, чем «от»';
  if(F.n!==''&&!(+F.n>=1&&+F.n<=500))E.n='От 1 до 500';
  if(CONTACT_RE.test(F.about||''))E.about='Уберите телефон, почту и ссылки: контакты кандидатов придут после их согласия';
  S.ferr=E;return !Object.keys(E).length;
}
function saveForm(st,extra={}){
  const F=S.form,rec={...F,t:(F.t||'').trim()||'Без названия',from:+F.from||0,to:+F.to||0,n:+F.n||1,st,date:NOW,...extra};
  if(F.id){const i=S.vacs.findIndex(v=>v.id===F.id);S.vacs[i]={...S.vacs[i],...rec}}else{rec.id='v'+(S.vacs.length+10);S.vacs.unshift(rec)}
}
function sendReq(cid,vid){
  const r=S.resp.find(x=>x.c===cid&&x.v===vid)||S.resp.find(x=>x.c===cid&&x.st==='new');
  if(r){r.st='wait';r.req=nowD();r.v=r.v||vid}else S.resp.unshift({id:'r'+(S.nid++),c:cid,v:vid,how:'запрос',when:nowD(),st:'wait',req:nowD()});
}
// повтор кода: таймер 60 с, подпись обновляется раз в секунду без полной перерисовки
function startTimer(){S.lg.until=Date.now()+60000;clearInterval(startTimer.t);startTimer.t=setInterval(()=>{const b=$('#lres');if(!b||S.lg.step!=='code'){clearInterval(startTimer.t);return}b.outerHTML=resendBtn();if(Date.now()>S.lg.until)clearInterval(startTimer.t)},1000)}
function regValidate(){
  const R=S.rg,E={},inn=R.inn.replace(/\D/g,'');
  if(!(inn.length===10||inn.length===12))E.inn='ИНН — 10 цифр для организации или 12 для ИП';
  if(R.name.trim().length<3)E.name='Укажите название компании';
  if(!R.reg)E.reg='Выберите регион';
  if(R.fio.trim().length<3)E.fio='Укажите имя и фамилию';
  if(!MAIL_RE.test(R.mail.trim()))E.mail='Проверьте почту: нужен вид имя@домен';
  if(R.phone.replace(/\D/g,'').length!==10)E.phone='Нужно 10 цифр после +7';
  R.err=E;return !Object.keys(E).length;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-st],[data-a],[data-view],[data-fp],[data-fr],[data-rs],[data-fck],[data-lby],[data-more]');if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.st){seed(d.st);render();const s=$('#scroll');s&&(s.scrollTop=0);return}
  if(d.view)return go(d.view);
  if(d.more){S.pg[d.more]+=d.more==='jobs'?10:d.more==='cand'?12:15;return render()}
  if(d.rs){S.rf.s=d.rs;S.pg.resp=15;return render()}
  if(d.fck){S.form[d.fck]=!S.form[d.fck];return render()}
  if(d.lby){S.lg.by=d.lby;S.lg.err='';render();const i=$('#lid');i&&i.focus();return}
  const a=d.a,L=S.lg;
  switch(a){
    case 'theme':S.theme=S.theme==='dark'?'light':'dark';sessionStorage.setItem('hr-theme',S.theme);return render();
    case 'off':S.off=!S.off;if(S.form)runCheck(true);return render();
    case 'slow':S.slow=!S.slow;render();return toast(S.slow?'Медленная сеть: разделы открываются с загрузкой':'Сеть обычная');
    case 'fail':S.fail=!S.fail;render();return toast(S.fail?'Ошибка сервера: следующие запросы не пройдут':'Сервер снова отвечает');
    case 'demo':S.dlg='demo';return render();
    case 'moreNav':S.dlg='moreNav';return render();
    case 'dclose':S.dlg=null;return render();
    case 'toLogin':S.lg={...S.lg,step:'id',code:'',err:'',tries:5};return go('login');
    case 'toReg':return go('reg');
    case 'toHome':S.aud='emp';return go('home');
    case 'toCab':S.aud='emp';return go('sum');
    case 'logout':S.logged=false;return go('home');
    case 'lSend':{const v=($('#lid').value||'').trim();
      if(L.by==='mail'){L.mail=v;if(!MAIL_RE.test(v)){L.err='Проверьте почту: нужен вид имя@домен';return render()}}
      else{L.phone=v;if(v.replace(/\D/g,'').length!==10){L.err='Нужно 10 цифр после +7';return render()}}
      L.err='';return call('login',700,()=>{L.step='code';L.code='';L.tries=5;startTimer();setTimeout(()=>{const i=$('#lcode');i&&i.focus()},30)})}
    case 'lAgain':if(Date.now()<L.until)return;return call('login',500,()=>{L.code='';L.err='';L.tries=5;startTimer();toast(L.by==='mail'?'Новый код отправлен на почту · демо 1234':'Новый код отправлен в SMS · демо 1234')});
    case 'lCode':{const c=($('#lcode').value||'').trim();L.code=c;
      if(c.length<4){L.err='Введите 4 цифры';return render()}
      if(c!=='1234'){L.tries--;L.err=L.tries>0?'Код не подходит. Осталось попыток: '+L.tries:'Попытки закончились — запросите новый код';return render()}
      L.err='';return call('login',600,()=>{S.logged=true;S.view='sum';toast('Вход выполнен · '+CO)})}
    case 'lBack':L.step='id';L.err='';return render();
    case 'regSend':{const A=S.rg.agree;if(!(A.terms&&A.pd&&A.cand))return;
      if(!regValidate()){render();const k=Object.keys(S.rg.err)[0],i=$('#r_'+k);i&&i.focus();return}
      return call('reg',900,()=>{S.view='regdone';S.set.ads=A.ads})}
    case 'regEnter':S.logged=true;S.pending=true;S.st='new';return go('sum');
    case 'retry':return call('retry',700,()=>{S.err=false});
    case 'newVac':return newForm(null);
    case 'editVac':return newForm(vac(d.v));
    case 'closeVac':S.closeV=d.v;S.dlg='close';return render();
    case 'closeYes':vac(S.closeV).st='closed';S.dlg=null;render();return toast('Вакансия снята с публикации');
    case 'saveDraft':if(S.busy.pub)return;saveForm('draft');go('vac');return toast('Черновик сохранён');
    case 'publish':{if(S.busy.pub)return;
      if(!validate()){render();const k=Object.keys(S.ferr)[0],i=$('#f_'+k);i&&i.focus();return}
      if(S.off){saveForm('draft');go('vac');return toast('Нет сети. Черновик сохранён — опубликуйте, когда сеть появится.',true)}
      return call('pub',900,()=>{const r=ruleCheck(S.form.reg,S.form.sph);
        if(!r.ok){saveForm('blocked',{why:r.why});S.view='vac';S.form=null;toast('Публикация остановлена проверкой — вакансия сохранена как «остановлена»',true)}
        else if(S.pending){saveForm('draft');S.view='vac';S.form=null;toast('Сохранено. Опубликуем, когда компания пройдёт проверку')}
        else{saveForm('pub');S.view='vac';S.form=null;toast('Вакансия опубликована')}})}
    case 'req':S.reqC=d.c;S.reqV=(S.vacs.find(v=>v.st==='pub')||{}).id;S.dlg='req';return render();
    case 'reqSend':return call('req',800,()=>{sendReq(S.reqC,S.reqV);S.dlg=null;toast('Запрос отправлен — кандидат ответит на портале или в «Моём маршруте»')});
    case 'reqR':{const r=S.resp.find(x=>x.id===d.r);return call('q'+r.id,800,()=>{sendReq(r.c,r.v);toast('Запрос отправлен — кандидат ответит на портале или в «Моём маршруте»')})}
    case 'dYes':{const r=S.resp.find(x=>x.id===d.r);r.st='ok';r.at=nowD();S.log.unshift({at:r.at,c:r.c,v:r.v,ev:'g'});render();return toast('Кандидат согласился — контакты открыты только вам')}
    case 'dNo':{const r=S.resp.find(x=>x.id===d.r);r.st='no';render();return toast('Кандидат отказал — контакты не передаются')}
    case 'dRev':{const r=S.resp.find(x=>x.id===d.r);r.st='rev';r.rev=nowD();S.log.unshift({at:r.rev,c:r.c,v:r.v,ev:'r'});render();return toast('Кандидат отозвал согласие — контакты скрыты',true)}
    case 'copy':try{navigator.clipboard&&navigator.clipboard.writeText(d.ph).catch(()=>{})}catch(_){}return toast('Номер скопирован');
    case 'card':S.cardC=d.c;S.dlg='card';return render();
    case 'fdocs':S.f.docs=!S.f.docs;S.pg.cand=12;return render();
    case 'fclear':S.f={prof:'Все',reg:'Все',docs:false};S.q.cand='';return render();
    case 'jhousing':S.jf.housing=!S.jf.housing;S.pg.jobs=10;return render();
    case 'jclear':S.jf={sph:'Все',reg:'Все',housing:false};S.q.jobs='';return render();
    case 'readAll':S.notifs.forEach(n=>n.read=true);render();return toast('Все уведомления прочитаны');
    case 'invite':{const m=($('#invMail').value||'').trim();S.inv.mail=m;S.inv.role=$('#invRole').value;
      if(!MAIL_RE.test(m)){S.inv.err='Проверьте почту: нужен вид имя@домен';return render()}
      if(S.users.some(u=>u.mail===m)){S.inv.err='У этого человека уже есть доступ';return render()}
      S.inv.err='';return call('inv',700,()=>{S.users.push({id:'u'+Date.now(),name:m.split('@')[0],mail:m,role:S.inv.role,last:'приглашение отправлено'});S.inv.mail='';toast('Приглашение отправлено')})}
  }
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.f;
  if(k&&S.form&&t.tagName!=='SELECT'){let v=t.value;if(['from','to','n'].includes(k)){v=v.replace(/\D/g,'').slice(0,7);if(v!==t.value)t.value=v}
    S.form[k]=v;if(S.ferr[k]){delete S.ferr[k];t.classList.remove('bad');const er=$('#e_'+k);er&&(er.textContent='')}
    if(!Object.keys(S.ferr).length){const n=$('#ferrNote');n&&n.remove()}
    const pv=$('#pv');pv&&(pv.innerHTML=previewCard(S.form))}
  if(t.dataset.q){const q=t.dataset.q,p=t.selectionStart;S.q[q]=t.value;S.pg[q]&&(S.pg[q]=q==='jobs'?10:q==='cand'?12:15);render();const n=$('#q_'+q);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}
  if(t.id==='lid'){if(S.lg.by==='mail')S.lg.mail=t.value;else{t.value=t.value.replace(/[^\d\s-]/g,'');S.lg.phone=t.value}}
  if(t.id==='lcode'){t.value=t.value.replace(/\D/g,'').slice(0,4);S.lg.code=t.value}
  if(t.dataset.rg&&t.tagName!=='SELECT'){const f=t.dataset.rg;let v=t.value;if(f==='inn'){v=v.replace(/\D/g,'').slice(0,12);t.value=v}if(f==='phone'){v=v.replace(/[^\d\s-]/g,'');t.value=v}
    S.rg[f]=v;const ek=f;if(S.rg.err[ek]){delete S.rg.err[ek];t.classList.remove('bad');const er=t.closest('.f').querySelector('.err');er&&(er.textContent='')}}
  if(t.id==='invMail')S.inv.mail=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&t.tagName==='SELECT'){S.form[t.dataset.f]=t.value;delete S.ferr[t.dataset.f];runCheck(false)}
  if(t.hasAttribute('data-rv')){S.rf.v=t.value;S.pg.resp=15;render()}
  if(t.hasAttribute('data-reqv'))S.reqV=t.value;
  if(t.dataset.fsel){S.f[t.dataset.fsel]=t.value;S.pg.cand=12;render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='lid')$('[data-a="lSend"]').click();
  if(e.key==='Enter'&&e.target.id==='lcode')$('[data-a="lCode"]').click();
  if(e.key==='Escape'&&S.dlg){S.dlg=null;render()}
});

// старт: ?st=…&view=…&theme=…&off=1 — только для тестов; владельцу — меню «Демо»
const q0=new URLSearchParams(location.search);
seed([...ST,...ST2].some(x=>x.k===q0.get('st'))?q0.get('st'):'pub');
S.theme=q0.get('theme')||sessionStorage.getItem('hr-theme')||'dark';
if(q0.get('view'))S.view=q0.get('view');
if(q0.get('off'))S.off=true;
render();

</script>
